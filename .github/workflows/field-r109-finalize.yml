name: field-r109-finalize

on:
  push:
    branches:
      - field/r10.9-macos-portability-live-memory-20260907

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final deterministic patch
        run: python3 tools/field_r109_finalize.py

      - name: Verify intended diff only
        run: |
          git diff --check
          grep -q 'EFileAction::Open, ""' product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          grep -q 'EFileAction::Save, ""' product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          grep -q 'Validate the complete destination before changing the active library' product/AeylaVisualDmx/AeylaVisualDmx.h

      - name: Configure core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build and run focused regressions
        run: |
          cmake --build build --target aeyla_take_file_tests aeyla_live_memory_session_tests --config Release -j 2
          ctest --test-dir build -R '^(aeyla_take_file_tests|aeyla_live_memory_session_tests)$' --output-on-failure

      - name: Commit verified product patch and remove one-shot scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/field-r109-finalize.yml tools/field_r109_finalize.py .field-r109-trigger
          git add product/AeylaVisualDmx/AeylaRuntimeStatusControl.h product/AeylaVisualDmx/AeylaVisualDmx.h
          git commit -m 'fix: finalize macOS show transfer and fail-safe take relink'
          git push origin HEAD:${GITHUB_REF_NAME}
