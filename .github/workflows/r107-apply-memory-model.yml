name: r107-apply-memory-model

on:
  push:
    branches:
      - rgb/r10.7-renamable-live-memories-ui-20260831
    paths:
      - tools/r107_apply_memory_model.py
      - .github/workflows/r107-apply-memory-model.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.7-renamable-live-memories-ui-20260831
          fetch-depth: 0
          persist-credentials: true

      - name: Apply R10.7 memory model
        run: |
          python3 tools/r107_apply_memory_model.py
          git diff --check

      - name: Configure core
        run: cmake -S . -B build

      - name: Build core
        run: cmake --build build --config Release

      - name: Test core
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Publish verified model and remove one-shot tooling
        run: |
          git config user.name "rgb-estudios-r10.7-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/project/live_memory_state.h \
                  src/project/live_memory_state.cpp \
                  product/AeylaVisualDmx/AeylaLiveMemorySession.h \
                  product/AeylaVisualDmx/AeylaLiveMemorySession.cpp \
                  product/AeylaVisualDmx/AeylaVisualDmx.h \
                  tests/test_live_memory_state.cpp \
                  tests/test_live_memory_session.cpp
          git rm tools/r107_apply_memory_model.py \
                 .github/workflows/r107-apply-memory-model.yml
          git diff --cached --check
          git commit -m "feat(r10.7): persist renamable expandable live memories"
          git push origin HEAD:rgb/r10.7-renamable-live-memories-ui-20260831
