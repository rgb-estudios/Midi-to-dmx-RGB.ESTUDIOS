name: r106-apply-project-identity-sync-copy

on:
  push:
    branches:
      - rgb/r10.6-pro-ui-stabilization-20260830
    paths:
      - tools/r106_project_identity_sync_copy_patch.py
      - .github/workflows/r106-apply-project-identity-sync-copy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.6-pro-ui-stabilization-20260830
          fetch-depth: 0
      - name: Apply guarded identity/sync copy patch
        run: python3 tools/r106_project_identity_sync_copy_patch.py
      - name: Verify identity and actual synchronization vocabulary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const std::string showContext' product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          grep -Fq 'mPlug.ProjectName()' product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          grep -Fq 'std::string name{"Untitled Show"};' src/project/project_document.h
          grep -Fq 'document.name = "Untitled Show";' src/project/project_document.cpp
          grep -Fq 'ANCLA DAW / MIDI SHOW' product/AeylaVisualDmx/AeylaShowPlayerIntegration.cpp
          grep -Fq 'ESPERANDO PLAY DEL DAW / MIDI SHOW' product/AeylaVisualDmx/AeylaShowPlayerIntegration.cpp
          grep -Fq 'MIDI PLAY bloqueado mientras GRABAR DMX está activo' product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp
          ! grep -Fq 'REPRODUCIR / MTC' product/AeylaVisualDmx/AeylaShowPlayerIntegration.cpp
          ! grep -Fq 'mientras AEYLA está grabando' product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp
          ! grep -Fq 'Could not open AEYLA project package' src/product/project_file_controller.cpp
      - name: Commit result and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/r106_project_identity_sync_copy_patch.py
          rm -f .github/workflows/r106-apply-project-identity-sync-copy.yml
          git config user.name 'rgb-estudios-r10.6-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(r10.6): use project identity and real sync sources'
          git push origin HEAD:rgb/r10.6-pro-ui-stabilization-20260830
