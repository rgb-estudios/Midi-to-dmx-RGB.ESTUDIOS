name: r104-source-snapshot

on:
  push:
    branches:
      - rgb/r10.4-persistent-operator-authority-20260830

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect exact R10.4 source snapshot
        run: |
          mkdir -p snapshot/product/AeylaVisualDmx snapshot/src/product snapshot/src/runtime snapshot/tests
          cp product/AeylaVisualDmx/AeylaVisualDmx.cpp snapshot/product/AeylaVisualDmx/
          cp product/AeylaVisualDmx/AeylaVisualDmx.h snapshot/product/AeylaVisualDmx/
          cp product/AeylaVisualDmx/AeylaShowPlayerIntegration.cpp snapshot/product/AeylaVisualDmx/
          cp src/product/application_model.cpp snapshot/src/product/
          cp src/product/application_model.h snapshot/src/product/
          cp src/runtime/runtime_safety_state.cpp snapshot/src/runtime/
          cp src/runtime/runtime_safety_state.h snapshot/src/runtime/
          cp tests/test_application_model.cpp snapshot/tests/
          cp tests/test_runtime_safety.cpp snapshot/tests/
          cp CMakeLists.txt snapshot/
      - uses: actions/upload-artifact@v4
        with:
          name: r104-source-snapshot
          path: snapshot
          if-no-files-found: error
