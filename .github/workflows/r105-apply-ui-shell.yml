name: r105-apply-ui-shell

on:
  push:
    branches:
      - rgb/r10.5-blackout-ui-contract-20260830
    paths:
      - patches/r105_ui_shell.py
      - .github/workflows/r105-apply-ui-shell.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.5-blackout-ui-contract-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Apply unified product shell
        shell: bash
        run: |
          python patches/r105_ui_shell.py
          git diff --check
          git config user.name "rgb-estudios-r10.5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product/AeylaVisualDmx/AeylaVisualDmx.h \
                  product/AeylaVisualDmx/AeylaMainControl.h \
                  product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          git rm patches/r105_ui_shell.py .github/workflows/r105-apply-ui-shell.yml
          git diff --cached --quiet && { echo "No UI changes produced"; exit 1; }
          git commit -m "ui(r10.5): unify TOMA EN VIVO MIDI SISTEMA shell"
          git push origin HEAD:rgb/r10.5-blackout-ui-contract-20260830
