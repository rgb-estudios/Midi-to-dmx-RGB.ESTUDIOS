name: r106-apply-take-visual-hierarchy

on:
  push:
    branches:
      - rgb/r10.6-pro-ui-stabilization-20260830
    paths:
      - .github/workflows/r106-apply-take-visual-hierarchy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.6-pro-ui-stabilization-20260830
          fetch-depth: 0

      - name: Apply TOMA visual hierarchy
        run: python3 .github/scripts/r106_apply_take_visual_hierarchy.py

      - name: Verify patch
        run: |
          git diff --check
          grep -q '"SETLIST"' product/AeylaVisualDmx/AeylaMainControl.h
          grep -q '"PLAY / PAUSA"' product/AeylaVisualDmx/AeylaMainControl.h
          grep -q 'SISTEMA · RED / SALIDA ART-NET' product/AeylaVisualDmx/AeylaMainControl.h

      - name: Commit result and remove applicator
        run: |
          git config user.name 'rgb-estudios-r10.6-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/r106-apply-take-visual-hierarchy.yml
          git rm .github/scripts/r106_apply_take_visual_hierarchy.py
          git add product/AeylaVisualDmx/AeylaMainControl.h
          git commit -m 'ui(r10.6): strengthen TOMA operator hierarchy'
          git push origin HEAD:rgb/r10.6-pro-ui-stabilization-20260830
