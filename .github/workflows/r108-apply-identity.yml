name: r108-apply-identity

on:
  push:
    branches:
      - rgb/r10.8-performance-stability-20260831

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.8-performance-stability-20260831
          fetch-depth: 0
          persist-credentials: true
      - id: staged
        shell: bash
        run: |
          if [ -f tools/r108_apply_identity.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.staged.outputs.present == 'true'
        run: |
          python3 tools/r108_apply_identity.py
          git diff --check
          grep -q 'R10.8 PRETEST' product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
      - if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "rgb-estudios-r10.8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          git rm tools/r108_apply_identity.py
          git diff --cached --check
          git commit -m "chore(r10.8): identify performance PRETEST in UI"
          git push origin HEAD:rgb/r10.8-performance-stability-20260831
