name: r104-manual-go-fix-temp

on:
  pull_request:
    branches:
      - rgb/r10.4-tooling-base-temp
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-manual-go-fix:
    if: github.event.pull_request.head.ref == 'rgb/r10.4-go-atomic-temp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary R10.4 GO head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply deterministic manual GO repair
        shell: bash
        run: |
          test -f patches/r104_manual_go_fix.py
          python3 patches/r104_manual_go_fix.py
          git diff --check
          git config user.name "rgb-estudios-r10.4-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product/AeylaVisualDmx/AeylaShowPlayerIntegration.cpp
          git rm patches/r104_manual_go_fix.py
          git diff --cached --quiet && { echo 'No GO changes produced'; exit 1; }
          git commit -m 'fix(r10.4): make manual GO switch songs without dropping Art-Net authority'
          git push origin HEAD:rgb/r10.4-go-atomic-temp
