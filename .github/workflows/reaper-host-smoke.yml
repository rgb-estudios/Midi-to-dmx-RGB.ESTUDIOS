name: reaper-host-smoke

on:
  pull_request:
    paths:
      - product/**
      - src/**
      - tests/reaper_host_smoke.lua
      - .github/workflows/reaper-host-smoke.yml
  workflow_dispatch:

env:
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0
  REAPER_VERSION: "7.78"

jobs:
  windows-reaper-vst3:
    name: Windows / REAPER 7.78 / VST3 host smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned plugin dependencies
        shell: pwsh
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout $env:IPLUG2_COMMIT
          $sdk = "external/iPlug2/Dependencies/IPlug/VST3_SDK"
          if (Test-Path $sdk) { Remove-Item -Recurse -Force $sdk }
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git $sdk
          git -C $sdk checkout $env:VST3SDK_COMMIT
          git -C $sdk submodule update --init --recursive

      - name: Build AEYLA VST3
        shell: pwsh
        run: |
          cmake -S product -B build-product -DIPLUG2_DIR="${{ github.workspace }}/external/iPlug2" -DIPLUG_DEPLOY_PLUGINS=OFF -DIGRAPHICS_BACKEND=NANOVG
          cmake --build build-product --config Release --target AeylaVisualDmx-vst3

      - name: Install AEYLA VST3 for REAPER
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build-product -Recurse -Directory -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "AEYLA VST3 bundle not found" }
          $destRoot = "C:\Program Files\Common Files\VST3"
          New-Item -ItemType Directory -Force $destRoot | Out-Null
          $dest = Join-Path $destRoot "AeylaVisualDmx.vst3"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Copy-Item -Recurse -Force $bundle.FullName $dest

      - name: Install REAPER 7.78 evaluation
        shell: pwsh
        timeout-minutes: 2
        run: |
          $url = "https://www.reaper.fm/files/7.x/reaper778_x64-install.exe"
          $installer = "$env:RUNNER_TEMP\reaper-install.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1223)) {
            throw "REAPER installer failed with $($process.ExitCode)"
          }

          $expectedPaths = @(
            "C:\Program Files\REAPER (x64)\reaper.exe",
            "C:\Program Files\REAPER\reaper.exe"
          )
          $reaper = $null
          foreach ($candidate in $expectedPaths) {
            if (Test-Path $candidate) {
              $reaper = Get-Item $candidate
              break
            }
          }
          if (-not $reaper) { throw "REAPER executable not found after completed silent install" }
          if ($reaper.Length -lt 1MB) { throw "REAPER executable is unexpectedly small: $($reaper.Length) bytes" }

          $stream = [System.IO.File]::OpenRead($reaper.FullName)
          try {
            $b0 = $stream.ReadByte()
            $b1 = $stream.ReadByte()
          }
          finally {
            $stream.Dispose()
          }
          if ($b0 -ne 0x4D -or $b1 -ne 0x5A) { throw "REAPER executable does not have a valid PE/MZ header" }

          Write-Host "REAPER executable: $($reaper.FullName) size=$($reaper.Length) installerExit=$($process.ExitCode)"
          "REAPER_EXE=$($reaper.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run REAPER host smoke
        shell: pwsh
        timeout-minutes: 3
        run: |
          $script = (Resolve-Path "tests/reaper_host_smoke.lua").Path
          $result = Join-Path $env:APPDATA "REAPER\AEYLA_REAPER_HOST_SMOKE.txt"
          Remove-Item -Force $result -ErrorAction SilentlyContinue

          # REAPER's official evaluation is fully functional for 60 days, but
          # first launch presents a timed "Still Evaluating" acknowledgement.
          # The CI runner has no human operator, so invoke only that legitimate
          # acknowledgement if it appears; do not modify licensing state.
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          function Invoke-ReaperEvaluationAcknowledgement {
            try {
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $condition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::Button
              )
              $buttons = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
              foreach ($button in $buttons) {
                $name = $button.Current.Name
                if ($name -like "Still Evaluating*") {
                  if ($button.Current.IsEnabled) {
                    $pattern = $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
                    $pattern.Invoke()
                    Write-Host "Acknowledged REAPER evaluation dialog."
                    return $true
                  }
                }
              }
            }
            catch {
              Write-Host "Evaluation-dialog probe: $($_.Exception.Message)"
            }
            return $false
          }

          $process = Start-Process -FilePath $env:REAPER_EXE -ArgumentList @("-newinst", "-nosplash", $script) -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $result)) {
            if ($process.HasExited) { break }
            Invoke-ReaperEvaluationAcknowledgement | Out-Null
            Start-Sleep -Milliseconds 500
            $process.Refresh()
          }

          if (-not (Test-Path $result)) {
            $exitText = if ($process.HasExited) { "exit=$($process.ExitCode)" } else { "still-running" }
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            throw "REAPER did not produce AEYLA host evidence ($exitText)"
          }

          Get-Content $result
          $passed = Select-String -Path $result -Pattern '^RESULT=PASS$' -Quiet
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          if (-not $passed) { throw "REAPER host smoke did not pass" }

      - name: Package verified REAPER test candidate
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build-product -Recurse -Directory -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "Verified VST3 bundle disappeared before packaging" }

          $root = Join-Path $PWD "reaper-candidate"
          $vst3Root = Join-Path $root "VST3"
          New-Item -ItemType Directory -Force $vst3Root | Out-Null
          Copy-Item -Recurse -Force $bundle.FullName (Join-Path $vst3Root "AeylaVisualDmx.vst3")

          @'
          AEYLA Visual DMX 0.3.0 — REAPER TEST CANDIDATE / WINDOWS

          This exact VST3 bundle passed the automated REAPER 7.78 host gate that
          scans the plug-in, instantiates it, opens its editor, saves a project,
          reopens it and opens the restored editor again.

          INSTALL
          1. Close REAPER.
          2. Run INSTALL_REAPER_VST3.cmd.
          3. Open REAPER and rescan VST3 plug-ins if AEYLA is not visible.
          4. Insert "AEYLA Visual DMX" on a test track.

          TEST SCOPE
          - Windows x64 / VST3.
          - Core build and regression tests.
          - REAPER scan + instantiate + editor open + project save/reopen + editor reopen.
          - Safe restore remains DISARMED / BLACKOUT by product contract.

          IMPORTANT
          This is a REAPER Test Candidate for programming and controlled rehearsal.
          It is NOT Show Candidate and must NOT be relied on yet for physical show
          output. Real Art-Net/node validation, deterministic DAW transport and the
          remaining show-readiness gates are still required.
          '@ | Set-Content -Encoding UTF8 (Join-Path $root "LEEME_REAPER_TEST.txt")

          @'
          @echo off
          setlocal
          set "SOURCE=%~dp0VST3\AeylaVisualDmx.vst3"
          set "DEST=C:\Program Files\Common Files\VST3\AeylaVisualDmx.vst3"
          if not exist "%SOURCE%" (
            echo ERROR: AeylaVisualDmx.vst3 not found.
            pause
            exit /b 1
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process powershell -Verb RunAs -Wait -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-Command','if (Test-Path ''%DEST%'') { Remove-Item -Recurse -Force ''%DEST%'' }; Copy-Item -Recurse -Force ''%SOURCE%'' ''%DEST%'''"
          echo AEYLA VST3 installation completed.
          pause
          '@ | Set-Content -Encoding ASCII (Join-Path $root "INSTALL_REAPER_VST3.cmd")

          $binary = Get-ChildItem (Join-Path $vst3Root "AeylaVisualDmx.vst3") -Recurse -File -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          if (-not $binary) { throw "Candidate VST3 binary not found" }
          $hash = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "VST3_BINARY_SHA256=$hash" | Set-Content -Encoding ASCII (Join-Path $root "SHA256.txt")
          "SOURCE_COMMIT=${{ github.sha }}" | Add-Content -Encoding ASCII (Join-Path $root "SHA256.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: AEYLA-0.3.0-REAPER-Test-Candidate-Windows-VST3
          path: reaper-candidate/**
          if-no-files-found: error

      - name: Collect REAPER Windows evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $root = Join-Path $env:APPDATA "REAPER"
          foreach ($name in @("AEYLA_REAPER_HOST_SMOKE.txt", "AEYLA_REAPER_HOST_SMOKE.rpp", "reaper-vstplugins64.ini", "reaper.ini")) {
            $path = Join-Path $root $name
            if (Test-Path $path) { Copy-Item -Force $path evidence/ }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEYLA-REAPER-7.78-Windows-VST3-evidence
          path: evidence/**
          if-no-files-found: warn

  macos-reaper-vst3-au:
    name: macOS / REAPER 7.78 / VST3 and AU host smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned plugin dependencies
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout "$IPLUG2_COMMIT"
          sdk="external/iPlug2/Dependencies/IPlug/VST3_SDK"
          rm -rf "$sdk"
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git "$sdk"
          git -C "$sdk" checkout "$VST3SDK_COMMIT"
          git -C "$sdk" submodule update --init --recursive

      - name: Build universal AEYLA VST3 and AUv2
        run: |
          cmake -S product -B build-product -G Xcode -DIPLUG2_DIR="${GITHUB_WORKSPACE}/external/iPlug2" -DIPLUG2_UNIVERSAL=ON -DIPLUG_DEPLOY_PLUGINS=OFF -DIGRAPHICS_BACKEND=NANOVG -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-product --config Release --target AeylaVisualDmx-vst3 AeylaVisualDmx-au

      - name: Install AEYLA formats
        run: |
          vst3="$(find build-product -type d -name 'AeylaVisualDmx.vst3' | head -n 1)"
          au="$(find build-product -type d -name 'AeylaVisualDmx.component' | head -n 1)"
          test -n "$vst3" && test -n "$au"
          codesign --force --deep --sign - "$vst3"
          codesign --force --deep --sign - "$au"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/VST3" "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3" "$HOME/Library/Audio/Plug-Ins/Components/AeylaVisualDmx.component"
          cp -R "$vst3" "$HOME/Library/Audio/Plug-Ins/VST3/"
          cp -R "$au" "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true

      - name: Install REAPER 7.78 evaluation
        run: |
          curl -fL "https://www.reaper.fm/files/7.x/reaper778_universal.dmg" -o "$RUNNER_TEMP/reaper.dmg"
          mount="$(hdiutil attach "$RUNNER_TEMP/reaper.dmg" -nobrowse | tail -n 1 | awk '{$1=$2=""; sub(/^  */, ""); print}')"
          app="$(find "$mount" -maxdepth 2 -type d -name 'REAPER.app' | head -n 1)"
          test -n "$app"
          rm -rf /Applications/REAPER.app
          cp -R "$app" /Applications/REAPER.app
          hdiutil detach "$mount"
          /Applications/REAPER.app/Contents/MacOS/REAPER -version || true

      - name: Run REAPER VST3 host smoke
        timeout-minutes: 3
        run: |
          result="$HOME/Library/Application Support/REAPER/AEYLA_REAPER_HOST_SMOKE.txt"
          rm -f "$result"
          /Applications/REAPER.app/Contents/MacOS/REAPER -newinst -nosplash "${GITHUB_WORKSPACE}/tests/reaper_host_smoke.lua" &
          pid=$!
          for i in {1..240}; do
            test -f "$result" && break
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if [ ! -f "$result" ]; then
            kill -9 "$pid" 2>/dev/null || true
            echo "REAPER did not produce AEYLA VST3 host evidence"
            exit 1
          fi
          cat "$result"
          passed=0
          grep -q '^RESULT=PASS$' "$result" && passed=1
          kill -9 "$pid" 2>/dev/null || true
          test "$passed" -eq 1

      - name: Force AU rescan and run REAPER AU host smoke
        timeout-minutes: 3
        run: |
          mv "$HOME/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3" "$RUNNER_TEMP/AeylaVisualDmx.vst3"
          result="$HOME/Library/Application Support/REAPER/AEYLA_REAPER_HOST_SMOKE.txt"
          rm -f "$result"
          rm -f "$HOME/Library/Application Support/REAPER/reaper-vstplugins64.ini"
          /Applications/REAPER.app/Contents/MacOS/REAPER -newinst -nosplash "${GITHUB_WORKSPACE}/tests/reaper_host_smoke.lua" &
          pid=$!
          for i in {1..240}; do
            test -f "$result" && break
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if [ ! -f "$result" ]; then
            kill -9 "$pid" 2>/dev/null || true
            echo "REAPER did not produce AEYLA AU host evidence"
            exit 1
          fi
          cat "$result"
          passed=0
          grep -q '^RESULT=PASS$' "$result" && passed=1
          kill -9 "$pid" 2>/dev/null || true
          test "$passed" -eq 1

      - name: Collect REAPER macOS evidence
        if: always()
        run: |
          mkdir -p evidence
          root="$HOME/Library/Application Support/REAPER"
          for name in AEYLA_REAPER_HOST_SMOKE.txt AEYLA_REAPER_HOST_SMOKE.rpp reaper-vstplugins64.ini reaper-auplugins64.ini reaper.ini; do
            test -f "$root/$name" && cp "$root/$name" evidence/ || true
          done
          system_profiler SPSoftwareDataType > evidence/macos-system.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEYLA-REAPER-7.78-macOS-VST3-AU-evidence
          path: evidence/**
          if-no-files-found: warn
