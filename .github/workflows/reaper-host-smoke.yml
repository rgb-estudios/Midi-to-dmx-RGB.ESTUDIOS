name: reaper-host-smoke

on:
  pull_request:
    paths:
      - product/**
      - src/**
      - .github/workflows/reaper-host-smoke.yml
  workflow_dispatch:

env:
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0
  REAPER_VERSION: "7.78"

permissions:
  contents: read

jobs:
  windows-reaper-vst3:
    name: Windows / REAPER 7.78 / VST3 startup compatibility
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned plugin dependencies
        shell: pwsh
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout $env:IPLUG2_COMMIT
          $sdk = "external/iPlug2/Dependencies/IPlug/VST3_SDK"
          if (Test-Path $sdk) { Remove-Item -Recurse -Force $sdk }
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git $sdk
          git -C $sdk checkout $env:VST3SDK_COMMIT
          git -C $sdk submodule update --init --recursive

      - name: Build and install AEYLA VST3
        shell: pwsh
        run: |
          cmake -S product -B build-product -DIPLUG2_DIR="${{ github.workspace }}/external/iPlug2" -DIPLUG_DEPLOY_PLUGINS=OFF -DIGRAPHICS_BACKEND=NANOVG
          cmake --build build-product --config Release --target AeylaVisualDmx-vst3

          $bundle = Get-ChildItem build-product -Recurse -Directory -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "AEYLA VST3 bundle not found" }
          $destRoot = "C:\Program Files\Common Files\VST3"
          New-Item -ItemType Directory -Force $destRoot | Out-Null
          $dest = Join-Path $destRoot "AeylaVisualDmx.vst3"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Copy-Item -Recurse -Force $bundle.FullName $dest

          $binary = Get-ChildItem $dest -Recurse -File -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          if (-not $binary) { throw "Installed AEYLA VST3 binary not found" }
          if ($binary.Length -lt 64KB) { throw "Installed AEYLA VST3 binary is unexpectedly small" }
          $hash = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "AEYLA_VST3=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AEYLA_VST3_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install REAPER 7.78 evaluation
        shell: pwsh
        timeout-minutes: 2
        run: |
          $url = "https://www.reaper.fm/files/7.x/reaper778_x64-install.exe"
          $installer = "$env:RUNNER_TEMP\reaper-install.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $process = Start-Process $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1223)) {
            throw "REAPER installer failed with $($process.ExitCode)"
          }

          $candidates = @(
            "C:\Program Files\REAPER (x64)\reaper.exe",
            "C:\Program Files\REAPER\reaper.exe"
          )
          $reaper = $null
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) { $reaper = Get-Item $candidate; break }
          }
          if (-not $reaper) { throw "REAPER executable not found" }
          if ($reaper.Length -lt 1MB) { throw "REAPER executable is unexpectedly small" }
          "REAPER_EXE=$($reaper.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: REAPER non-interactive startup compatibility
        shell: pwsh
        timeout-minutes: 1
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $evidence = Join-Path $PWD "evidence\REAPER_STARTUP_COMPATIBILITY.txt"

          # REAPER's evaluation first launch can present a timed acknowledgement.
          # CI may acknowledge that legitimate dialog, but it does not automate
          # AEYLA editor interaction or claim a physical host test.
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          function Invoke-ReaperEvaluationAcknowledgement {
            try {
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $condition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                [System.Windows.Automation.ControlType]::Button
              )
              $buttons = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
              foreach ($button in $buttons) {
                if ($button.Current.Name -like "Still Evaluating*" -and $button.Current.IsEnabled) {
                  $pattern = $button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
                  $pattern.Invoke()
                  return $true
                }
              }
            } catch {}
            return $false
          }

          $process = Start-Process -FilePath $env:REAPER_EXE -ArgumentList "-nosplash" -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline -and -not $process.HasExited) {
            Invoke-ReaperEvaluationAcknowledgement | Out-Null
            Start-Sleep -Milliseconds 500
            $process.Refresh()
          }

          if ($process.HasExited) {
            @(
              "RESULT=FAIL"
              "REASON=REAPER exited during startup compatibility smoke"
              "EXIT_CODE=$($process.ExitCode)"
              "SOURCE_COMMIT=$env:GITHUB_SHA"
              "AEYLA_VST3_SHA256=$env:AEYLA_VST3_SHA256"
            ) | Set-Content -Encoding UTF8 $evidence
            Get-Content $evidence
            throw "REAPER exited unexpectedly with $($process.ExitCode)"
          }

          $cache = Join-Path $env:APPDATA "REAPER\reaper-vstplugins64.ini"
          $discovery = "NOT_OBSERVED"
          if (Test-Path $cache) {
            Copy-Item -Force $cache evidence/
            if (Select-String -Path $cache -Pattern 'AeylaVisualDmx' -Quiet) {
              $discovery = "OBSERVED_IN_REAPER_CACHE"
            }
          }

          @(
            "RESULT=PASS"
            "PROVES=REAPER installs and remains alive with the exact AEYLA VST3 installed in the standard VST3 path"
            "AEYLA_DISCOVERY=$discovery"
            "SOURCE_COMMIT=$env:GITHUB_SHA"
            "AEYLA_VST3_SHA256=$env:AEYLA_VST3_SHA256"
            "DOES_NOT_PROVE=AEYLA instantiation, editor interaction, project save/restore, MIDI, Art-Net or physical output"
            "MANUAL_GATE_REQUIRED=Open AEYLA in REAPER on an interactive Windows machine and run the field checklist"
          ) | Set-Content -Encoding UTF8 $evidence
          Get-Content $evidence
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEYLA-R08-REAPER-Windows-startup-compatibility
          path: evidence/**
          if-no-files-found: warn

  macos-reaper-vst3-au:
    name: macOS / REAPER 7.78 / Universal plugin startup compatibility
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned plugin dependencies
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout "$IPLUG2_COMMIT"
          sdk="external/iPlug2/Dependencies/IPlug/VST3_SDK"
          rm -rf "$sdk"
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git "$sdk"
          git -C "$sdk" checkout "$VST3SDK_COMMIT"
          git -C "$sdk" submodule update --init --recursive

      - name: Build and install Universal AEYLA VST3 and AUv2
        run: |
          cmake -S product -B build-product -G Xcode -DIPLUG2_DIR="${GITHUB_WORKSPACE}/external/iPlug2" -DIPLUG2_UNIVERSAL=ON -DIPLUG_DEPLOY_PLUGINS=OFF -DIGRAPHICS_BACKEND=NANOVG -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-product --config Release --target AeylaVisualDmx-vst3 AeylaVisualDmx-au

          vst3="$(find build-product -type d -name 'AeylaVisualDmx.vst3' | head -n 1)"
          au="$(find build-product -type d -name 'AeylaVisualDmx.component' | head -n 1)"
          test -n "$vst3" && test -n "$au"
          codesign --force --deep --sign - "$vst3"
          codesign --force --deep --sign - "$au"

          vst3bin="$(find "$vst3/Contents/MacOS" -type f | head -n 1)"
          aubinary="$(find "$au/Contents/MacOS" -type f | head -n 1)"
          test -n "$vst3bin" && test -n "$aubinary"
          for binary in "$vst3bin" "$aubinary"; do
            archs="$(lipo -archs "$binary")"
            echo "$binary -> $archs"
            echo "$archs" | grep -q x86_64
            echo "$archs" | grep -q arm64
          done

          mkdir -p "$HOME/Library/Audio/Plug-Ins/VST3" "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3" "$HOME/Library/Audio/Plug-Ins/Components/AeylaVisualDmx.component"
          cp -R "$vst3" "$HOME/Library/Audio/Plug-Ins/VST3/"
          cp -R "$au" "$HOME/Library/Audio/Plug-Ins/Components/"
          shasum -a 256 "$vst3bin" | tee "$RUNNER_TEMP/aeyla-vst3-sha.txt"

      - name: Install REAPER 7.78 evaluation
        timeout-minutes: 3
        run: |
          curl -fL "https://www.reaper.fm/files/7.x/reaper778_universal.dmg" -o "$RUNNER_TEMP/reaper.dmg"
          mount_log="$RUNNER_TEMP/reaper-mount.txt"
          printf 'Y\n' | hdiutil attach "$RUNNER_TEMP/reaper.dmg" -nobrowse -readonly | tee "$mount_log"
          mount="$(awk '/\/Volumes\// {$1=$2=""; sub(/^  */, ""); print; exit}' "$mount_log")"
          app="$(find "$mount" -maxdepth 2 -type d -name 'REAPER.app' | head -n 1)"
          test -n "$app"
          rm -rf /Applications/REAPER.app
          cp -R "$app" /Applications/REAPER.app
          hdiutil detach "$mount" -force
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/REAPER.app/Contents/Info.plist

      - name: REAPER non-interactive startup compatibility
        timeout-minutes: 1
        run: |
          mkdir -p evidence
          evidence="$PWD/evidence/REAPER_STARTUP_COMPATIBILITY.txt"
          reaper="/Applications/REAPER.app/Contents/MacOS/REAPER"
          test -x "$reaper"

          "$reaper" -nosplash >"$PWD/evidence/reaper-stdout.txt" 2>"$PWD/evidence/reaper-stderr.txt" &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || exit_code=$?
            {
              echo "RESULT=FAIL"
              echo "REASON=REAPER exited during startup compatibility smoke"
              echo "EXIT_CODE=${exit_code:-unknown}"
              echo "SOURCE_COMMIT=$GITHUB_SHA"
            } > "$evidence"
            cat "$evidence"
            exit 1
          fi

          cache="$HOME/Library/Application Support/REAPER/reaper-vstplugins64.ini"
          discovery="NOT_OBSERVED"
          if [ -f "$cache" ]; then
            cp "$cache" evidence/
            if grep -qi 'AeylaVisualDmx' "$cache"; then
              discovery="OBSERVED_IN_REAPER_CACHE"
            fi
          fi

          {
            echo "RESULT=PASS"
            echo "PROVES=REAPER Universal installs and remains alive with Universal AEYLA VST3/AUv2 installed"
            echo "AEYLA_DISCOVERY=$discovery"
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "DOES_NOT_PROVE=AEYLA instantiation, editor interaction, project save/restore, MIDI, Art-Net or physical output"
            echo "MANUAL_GATE_REQUIRED=Open AEYLA in REAPER/Ableton on an interactive Mac and run the field checklist"
          } > "$evidence"
          cat "$evidence"
          kill -9 "$pid" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEYLA-R08-REAPER-macOS-startup-compatibility
          path: evidence/**
          if-no-files-found: warn
