name: r08-runtime-self-patch

on:
  push:
    branches:
      - aeyla/r08-capture-zero-midi-rec-20260829
    paths:
      - tools/dev/r08_apply_runtime_patch.py

permissions:
  contents: write

jobs:
  apply-runtime-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aeyla/r08-capture-zero-midi-rec-20260829
          fetch-depth: 0

      - name: Apply exact R08 runtime patch
        run: python3 tools/dev/r08_apply_runtime_patch.py

      - name: Verify patch scope and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          if [[ ${#changed[@]} -ne 2 ]]; then
            echo "Expected exactly two runtime files" >&2
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              product/AeylaVisualDmx/AeylaVisualDmx.cpp|product/AeylaVisualDmx/AeylaVisualDmx.h) ;;
              *) echo "Unexpected changed file: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit guarded runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rgb-estudios-r08-ci"
          git config user.email "actions@users.noreply.github.com"
          git add product/AeylaVisualDmx/AeylaVisualDmx.cpp product/AeylaVisualDmx/AeylaVisualDmx.h
          git commit -m "R08 fail closed on host audio reset"
          git push origin HEAD:aeyla/r08-capture-zero-midi-rec-20260829
