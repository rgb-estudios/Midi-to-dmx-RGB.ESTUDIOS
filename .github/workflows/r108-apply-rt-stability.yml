name: r108-apply-rt-stability

on:
  push:
    branches:
      - rgb/r10.8-performance-rt-stabilization-20260831
    paths:
      - tools/r108_apply_rt_stability.py
      - .github/workflows/r108-apply-rt-stability.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.8-performance-rt-stabilization-20260831
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic RT patch
        shell: pwsh
        run: |
          python tools/r108_apply_rt_stability.py
          git diff --check

      - name: Configure core
        shell: pwsh
        run: cmake -S . -B build

      - name: Build core
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Publish verified code changes
        shell: pwsh
        run: |
          git config user.name "rgb-estudios-r10.8-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/capture/dmx_take_stream_writer.cpp src/capture/dmx_take_stream_writer.h src/capture/dmx_take_scheduler.cpp src/capture/dmx_clip_playback_engine.cpp product/AeylaVisualDmx/AeylaVisualDmx.cpp product/AeylaVisualDmx/AeylaVisualDmx.h
          git diff --cached --check
          git commit -m "perf(r10.8): isolate capture IO and cut redundant realtime polling"
          git push origin HEAD:rgb/r10.8-performance-rt-stabilization-20260831
