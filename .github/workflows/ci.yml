name: core-ci

on:
  push:

permissions:
  contents: write

jobs:
  integrate-r08-take-reopen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aeyla/r08-capture-zero-midi-rec-20260829
          fetch-depth: 2

      - name: Guard exact R08 product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object product/AeylaVisualDmx/AeylaVisualDmx.cpp)" = "fbf44c8d1d9dfb80bee64f39d3e6b0df3f8ac6ce"
          test "$(git hash-object product/AeylaVisualDmx/AeylaTakeLibrarySession.cpp)" = "53b490bd246ea86360f38a72b829363910417430"
          ! grep -q "stage_persisted_state" product/AeylaVisualDmx/AeylaVisualDmx.cpp
          test -f tools/dev/r08_finalize_take_reopen.py

      - name: Apply finalizer
        run: python3 tools/dev/r08_finalize_take_reopen.py

      - name: Restore permanent repository shape
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/r08-integrate-take-reopen-once.yml \
            .github/workflows/r08-promote-take-state-codec-once.yml \
            .github/workflows/r08-take-state-codec-readonly.yml \
            .github/workflows/report-graphical-run.yml \
            tools/dev/r08_apply_take_state_codec.py \
            tools/dev/r08_validate_take_state_codec.py \
            tools/dev/r08_finalize_take_reopen.py
          echo '' | base64 -d > .github/workflows/ci.yml
          git diff --check

      - name: Validate persistence gates
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target aeyla_take_library_session_tests aeyla_plugin_state_tests --parallel 2
          ctest --test-dir build --output-on-failure -R 'aeyla_(take_library_session|plugin_state)_tests'

      - name: Commit clean validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rgb-estudios-r08-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "R08 restore Take session from host state 1.3"
          git push origin HEAD:aeyla/r08-capture-zero-midi-rec-20260829
