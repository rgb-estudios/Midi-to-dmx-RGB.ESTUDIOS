name: ableton-macos-field-dmg

on:
  pull_request:
    paths:
      - "product/**"
      - "src/**"
      - ".github/workflows/ableton-macos-field-dmg.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AEYLA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0

jobs:
  field-dmg:
    name: Build Universal VST3 + PKG + DMG
    runs-on: macos-15
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AEYLA_SOURCE_SHA }}

      - name: Patch macOS portable show restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('product/AeylaVisualDmx/AeylaRuntimeStatusControl.h')
          s = ui.read_text(encoding='utf-8')
          old_open = 'EFileAction::Open, ".aeylashow",'
          old_save = 'EFileAction::Save, ".aeylashow",'
          assert old_open in s, 'Open filter pattern not found'
          assert old_save in s, 'Save filter pattern not found'
          s = s.replace(old_open, 'EFileAction::Open, "",', 1)
          s = s.replace(old_save, 'EFileAction::Save, "aeylashow",', 1)
          ui.write_text(s, encoding='utf-8')

          hdr = Path('product/AeylaVisualDmx/AeylaVisualDmx.h')
          h = hdr.read_text(encoding='utf-8')
          needle = '''    if(status.succeeded)
    {
      const auto restored = aeyla::live_memory_session::restore_persistent_state(
          this, liveState);
      if(!restored.succeeded)
      {
        status.succeeded = false;
        status.message = "Proyecto abierto en modo seguro, pero live.bin no pudo publicarse";
        status.diagnostics.push_back(restored.message);
      }
    }
    return status;
  }

  aeyla::product::ProjectFileStatus SaveProjectFromUI()
'''
          replacement = '''    if(status.succeeded)
    {
      const auto restored = aeyla::live_memory_session::restore_persistent_state(
          this, liveState);
      if(!restored.succeeded)
      {
        status.succeeded = false;
        status.message = "Proyecto abierto en modo seguro, pero live.bin no pudo publicarse";
        status.diagnostics.push_back(restored.message);
      }
    }

    // R10.8.3 macOS portability: SHOW.aeylashow + TOMAS_DMX/
    // becomes operational without manual re-link on every open.
    if(status.succeeded && !path.empty())
    {
      std::error_code libraryError;
      const auto portableLibrary = path.parent_path() / "TOMAS_DMX";
      if(std::filesystem::is_directory(portableLibrary, libraryError) &&
         !libraryError)
      {
        std::string projectId;
        {
          const std::scoped_lock lock(mModelMutex);
          projectId = mModel.project_document().project_id;
        }
        aeyla::take_library_session::ensure_scope(this, projectId);
        aeyla::take_library_session::set_directory(this, portableLibrary);
        aeyla::take_library_session::set_storage_message(
            this, "TOMAS_DMX AUTO-VINCULADA · biblioteca portable lista");
        if(ShowMidiMapping().enabled)
          mMidiPreflightCursor.store(0, std::memory_order_release);
      }
    }
    return status;
  }

  aeyla::product::ProjectFileStatus SaveProjectFromUI()
'''
          assert needle in h, 'OpenProjectFromUI success block not found'
          h = h.replace(needle, replacement, 1)
          hdr.write_text(h, encoding='utf-8')

          cpp = Path('product/AeylaVisualDmx/AeylaVisualDmx.cpp')
          c = cpp.read_text(encoding='utf-8')

          refresh_needle = '''  mHostStateCache.project_schema_minor =
      mModel.project_document().schema_version.minor;
  mHostStateCache.grand_master = snapshot.grand_master;
'''
          refresh_replacement = '''  mHostStateCache.project_schema_minor =
      mModel.project_document().schema_version.minor;

  const auto currentProjectPath = mProjectFiles.current_path();
  if(!currentProjectPath.empty())
  {
    const auto utf8 = currentProjectPath.lexically_normal().generic_u8string();
    if(utf8.size() <= aeyla::runtime::kMaxProjectLocatorBytes)
    {
      mHostStateCache.locator_mode =
          aeyla::runtime::ProjectLocatorMode::absolute_development;
      mHostStateCache.project_locator.assign(
          reinterpret_cast<const char*>(utf8.data()), utf8.size());
    }
    else
    {
      mHostStateCache.locator_mode = aeyla::runtime::ProjectLocatorMode::none;
      mHostStateCache.project_locator.clear();
    }
  }
  else
  {
    mHostStateCache.locator_mode = aeyla::runtime::ProjectLocatorMode::none;
    mHostStateCache.project_locator.clear();
  }

  mHostStateCache.grand_master = snapshot.grand_master;
'''
          assert refresh_needle in c, 'RefreshHostStateCache insertion point not found'
          c = c.replace(refresh_needle, refresh_replacement, 1)

          pending_needle = '''  ClearShowMidiCommandsLocked();
  mTakeScheduler.disarm();
  mModel.release_transients();
  mModel.disarm(aeyla::runtime::RuntimeSafetyReason::project_reload);

  std::array<std::uint8_t, 16> currentUuid{};
'''
          pending_replacement = '''  ClearShowMidiCommandsLocked();
  mTakeScheduler.disarm();
  mModel.release_transients();
  mModel.disarm(aeyla::runtime::RuntimeSafetyReason::project_reload);

  if(pending->locator_mode ==
         aeyla::runtime::ProjectLocatorMode::absolute_development &&
     !pending->project_locator.empty())
  {
    try
    {
      std::u8string locatorUtf8;
      locatorUtf8.reserve(pending->project_locator.size());
      for(const unsigned char byte : pending->project_locator)
        locatorUtf8.push_back(static_cast<char8_t>(byte));
      const auto locator =
          std::filesystem::path(locatorUtf8).lexically_normal();
      std::error_code locatorError;
      if(std::filesystem::is_regular_file(locator, locatorError) &&
         !locatorError)
      {
        const auto reopened = mProjectFiles.open(locator);
        if(reopened.succeeded)
        {
          mLoadedTakeSongIndex.store(-1, std::memory_order_release);
          mActiveTakeSongIndex.store(-1, std::memory_order_release);
          SyncParametersFromProject();
          RefreshOutputBackendFromProjectLocked();
          (void)aeyla::live_memory_session::restore_persistent_state(
              this, mProjectFiles.live_memory_state());
        }
      }
    }
    catch(...)
    {
    }
  }

  std::array<std::uint8_t, 16> currentUuid{};
'''
          assert pending_needle in c, 'ApplyPendingHostState insertion point not found'
          c = c.replace(pending_needle, pending_replacement, 1)

          stage_needle = '''  else
  {
    aeyla::take_library_session::stage_persisted_state(
        this, mModel.project_document().project_id,
        pending->take_library_locator, pending->take_bindings);
  }

  mParameterUpdatePending.store(true, std::memory_order_release);
'''
          stage_replacement = '''  else
  {
    aeyla::take_library_session::stage_persisted_state(
        this, mModel.project_document().project_id,
        pending->take_library_locator, pending->take_bindings);

    if(aeyla::take_library_session::directory(this).empty())
    {
      const auto projectPath = mProjectFiles.current_path();
      if(!projectPath.empty())
      {
        std::error_code libraryError;
        const auto portableLibrary = projectPath.parent_path() / "TOMAS_DMX";
        if(std::filesystem::is_directory(portableLibrary, libraryError) &&
           !libraryError)
        {
          aeyla::take_library_session::set_directory(this, portableLibrary);
          aeyla::take_library_session::set_storage_message(
              this, "TOMAS_DMX AUTO-RESTAURADA · sesión portable lista");
        }
      }
    }
  }

  mParameterUpdatePending.store(true, std::memory_order_release);
'''
          assert stage_needle in c, 'Take library restore block not found'
          c = c.replace(stage_needle, stage_replacement, 1)
          cpp.write_text(c, encoding='utf-8')
          PY

          grep -n 'EFileAction::Open, ""\|TOMAS_DMX AUTO\|absolute_development\|AUTO-RESTAURADA' \
            product/AeylaVisualDmx/AeylaRuntimeStatusControl.h \
            product/AeylaVisualDmx/AeylaVisualDmx.h \
            product/AeylaVisualDmx/AeylaVisualDmx.cpp

      - name: Fetch pinned iPlug2 and Steinberg SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout "$IPLUG2_COMMIT"
          sdk="external/iPlug2/Dependencies/IPlug/VST3_SDK"
          rm -rf "$sdk"
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git "$sdk"
          git -C "$sdk" checkout "$VST3SDK_COMMIT"
          git -C "$sdk" submodule update --init --recursive

      - name: Build Universal VST3
        shell: bash
        run: |
          set -euo pipefail
          cmake -S product -B build-product -G Xcode \
            -DIPLUG2_DIR="$GITHUB_WORKSPACE/external/iPlug2" \
            -DIPLUG2_UNIVERSAL=ON \
            -DIPLUG_DEPLOY_PLUGINS=OFF \
            -DIGRAPHICS_BACKEND=NANOVG \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-product --config Release \
            --target AeylaVisualDmx-vst3 --parallel 2

      - name: Verify and ad-hoc sign VST3
        shell: bash
        run: |
          set -euo pipefail
          vst3="$(find build-product -type d -name 'AeylaVisualDmx.vst3' | head -n 1)"
          test -n "$vst3"
          bin="$vst3/Contents/MacOS/AeylaVisualDmx"
          lipo "$bin" -verify_arch arm64 x86_64
          codesign --force --deep --sign - "$vst3"
          codesign --verify --deep --strict --verbose=2 "$vst3"
          file "$bin"

      - name: Validate VST3 with Steinberg validator
        shell: bash
        run: |
          set -euo pipefail
          cmake -S external/iPlug2/Dependencies/IPlug/VST3_SDK \
            -B build-validator -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          cmake --build build-validator --config Release --target validator --parallel 2
          vst3="$(find build-product -type d -name 'AeylaVisualDmx.vst3' | head -n 1)"
          validator="$(find build-validator -type f -name validator -perm +111 | head -n 1)"
          "$validator" "$vst3"

      - name: Build field installer PKG and DMG
        shell: bash
        run: |
          set -euo pipefail
          vst3="$(find build-product -type d -name 'AeylaVisualDmx.vst3' | head -n 1)"
          root="$GITHUB_WORKSPACE/pkgroot"
          scripts="$GITHUB_WORKSPACE/pkgscripts"
          dmgroot="$GITHUB_WORKSPACE/dmgroot"
          mkdir -p "$root/Library/Audio/Plug-Ins/VST3" "$scripts" "$dmgroot"
          ditto "$vst3" "$root/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3"

          cat > "$scripts/preinstall" <<'EOF'
          #!/bin/bash
          set -e
          rm -rf "/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3"
          for home in /Users/*; do
            [ -d "$home/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3" ] && \
              rm -rf "$home/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3" || true
          done
          exit 0
          EOF

          cat > "$scripts/postinstall" <<'EOF'
          #!/bin/bash
          set -e
          target="/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3"
          /usr/bin/xattr -dr com.apple.quarantine "$target" 2>/dev/null || true
          /usr/bin/codesign --verify --deep --strict "$target"
          /usr/bin/touch "$target"
          /usr/bin/killall -9 AudioComponentRegistrar 2>/dev/null || true
          exit 0
          EOF
          chmod +x "$scripts/preinstall" "$scripts/postinstall"

          pkgbuild \
            --root "$root" \
            --scripts "$scripts" \
            --identifier "com.rgbestudios.aeyla.vst3" \
            --version "10.8.3" \
            --install-location "/" \
            "$dmgroot/Install RGB Live Control AEYLA VST3.pkg"

          cat > "$dmgroot/LEEME PRIMERO.txt" <<'EOF'
          RGB Live Control / AEYLA R10.8.3 — PORTABLE RESTORE macOS

          FIXES:
          - ABRIR no bloquea .aeylashow por el selector nativo de macOS.
          - SHOW.aeylashow + TOMAS_DMX/ se vinculan automáticamente.
          - Ableton recuerda el .aeylashow y la biblioteca al reabrir la sesión.
          - La salida física siempre restaura DESARMADA / APAGÓN seguro.

          INSTALACIÓN:
          1) Cierra Ableton Live.
          2) Instala "Install RGB Live Control AEYLA VST3.pkg".
          3) Si macOS bloquea el paquete:
             sudo installer -pkg "/Volumes/RGB Live Control AEYLA/Install RGB Live Control AEYLA VST3.pkg" -target /
          4) Abre Ableton > Settings > Plug-Ins.
          5) VST3 System Folders OFF -> ON y Option + Rescan.
          6) Copia al disco local una carpeta con:
             SHOW_FINAL_02_MAC.aeylashow
             TOMAS_DMX/
          7) Primera vez: ARCHIVO > ABRIR > SHOW_FINAL_02_MAC.aeylashow.
          8) Guarda la sesión de Ableton. Las aperturas siguientes restauran
             show y biblioteca sin volver a importar.

          FIELD/PRETEST: firma ad-hoc, no notarizada con Apple Developer ID.
          EOF

          printf 'SOURCE_COMMIT=%s\nARCHITECTURES=arm64+x86_64\nTARGET_HOST=Ableton Live 12 macOS\nSTATUS=FIELD_PRETEST\nSIGNING=AD_HOC\nMAC_SHOW_PICKER=UNFILTERED_VALIDATE_AFTER_SELECTION\nPORTABLE_TAKE_FOLDER=TOMAS_DMX\nHOST_AUTO_REOPEN=ON\n' \
            "$AEYLA_SOURCE_SHA" > "$dmgroot/BUILD_ID.txt"
          shasum -a 256 "$root/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3/Contents/MacOS/AeylaVisualDmx" \
            > "$dmgroot/VST3_SHA256.txt"

          hdiutil create \
            -volname "RGB Live Control AEYLA" \
            -srcfolder "$dmgroot" \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/RGB-Live-Control-AEYLA-R10.8.3-macOS-Portable-Restore.dmg"

          hdiutil verify "$GITHUB_WORKSPACE/RGB-Live-Control-AEYLA-R10.8.3-macOS-Portable-Restore.dmg"
          shasum -a 256 "$GITHUB_WORKSPACE/RGB-Live-Control-AEYLA-R10.8.3-macOS-Portable-Restore.dmg" \
            > "$GITHUB_WORKSPACE/RGB-Live-Control-AEYLA-R10.8.3-macOS-Portable-Restore.dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: RGB-Live-Control-AEYLA-R10.8.3-macOS-Portable-Restore-DMG
          path: |
            RGB-Live-Control-AEYLA-R10.8.3-macOS-Portable-Restore.dmg
            RGB-Live-Control-AEYLA-R10.8.3-macOS-Portable-Restore.dmg.sha256
          if-no-files-found: error
          retention-days: 30
