name: field-r1014-daw-session-recovery

on:
  push:
    branches:
      - field/r10.14-daw-session-recovery-20260914

permissions:
  contents: write

env:
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0

jobs:
  macos:
    name: R10.14 macOS Universal - DAW session recovery
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize R10.14 source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r1014_materialize.py
          git diff --check
          git diff --stat

      - name: Run core regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core --config Release --parallel 2 --target aeyla_project_package_tests aeyla_project_file_controller_tests aeyla_plugin_state_tests aeyla_take_library_session_tests aeyla_live_memory_session_tests aeyla_show_midi_control_tests aeyla_host_song_binding_tests aeyla_dmx_clip_playback_engine_tests
          ctest --test-dir build-core --output-on-failure -R '^(aeyla_project_package_tests|aeyla_project_file_controller_tests|aeyla_plugin_state_tests|aeyla_take_library_session_tests|aeyla_live_memory_session_tests|aeyla_show_midi_control_tests|aeyla_host_song_binding_tests|aeyla_dmx_clip_playback_engine_tests)$'

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name rgb-estudios-ci
          git config user.email claudio@rgb-estudios.com
          git add src product tests
          if ! git diff --cached --quiet; then
            git commit -m 'field: materialize R10.14 DAW session recovery [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Fetch pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout "$IPLUG2_COMMIT"
          sdk=external/iPlug2/Dependencies/IPlug/VST3_SDK
          rm -rf "$sdk"
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git "$sdk"
          git -C "$sdk" checkout "$VST3SDK_COMMIT"
          git -C "$sdk" submodule update --init --recursive

      - name: Build Universal VST3
        shell: bash
        run: |
          set -euo pipefail
          cmake -S product -B build-product -G Xcode -DIPLUG2_DIR="$GITHUB_WORKSPACE/external/iPlug2" -DIPLUG2_UNIVERSAL=ON -DIPLUG_DEPLOY_PLUGINS=OFF -DIGRAPHICS_BACKEND=NANOVG -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-product --config Release --target AeylaVisualDmx-vst3 --parallel 2

      - name: Validate Universal VST3
        shell: bash
        run: |
          set -euo pipefail
          vst3="$(find build-product -type d -name AeylaVisualDmx.vst3 | head -n 1)"
          test -n "$vst3"
          lipo "$vst3/Contents/MacOS/AeylaVisualDmx" -verify_arch arm64 x86_64
          codesign --force --deep --sign - "$vst3"
          codesign --verify --deep --strict --verbose=2 "$vst3"
          cmake -S external/iPlug2/Dependencies/IPlug/VST3_SDK -B build-validator -G Xcode -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          cmake --build build-validator --config Release --target validator --parallel 2
          validator="$(find build-validator -type f -name validator -perm +111 | head -n 1)"
          "$validator" "$vst3"

      - name: Build PKG and DMG
        shell: bash
        run: |
          set -euo pipefail
          vst3="$(find build-product -type d -name AeylaVisualDmx.vst3 | head -n 1)"
          root="$GITHUB_WORKSPACE/pkgroot"
          scripts="$GITHUB_WORKSPACE/pkgscripts"
          dmgroot="$GITHUB_WORKSPACE/dmgroot"
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$root/Library/Audio/Plug-Ins/VST3" "$scripts" "$dmgroot" "$out"
          ditto "$vst3" "$root/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3"

          cat > "$scripts/preinstall" <<'EOF'
          #!/bin/bash
          set -euo pipefail

          LOG=/var/tmp/AEYLA-installer-cleanup.log
          exec >>"$LOG" 2>&1
          echo "=== AEYLA R10.14 preinstall $(date) ==="

          cleanup_dir() {
            dir="$1"
            [ -d "$dir" ] || return 0
            /usr/bin/find "$dir" -maxdepth 1 -type d \( \
              -iname 'AeylaVisualDmx*.vst3' -o \
              -iname 'AEYLA*DMX*.vst3' -o \
              -iname 'RGB*AEYLA*.vst3' \
            \) -print -exec /bin/rm -rf {} + 2>/dev/null || true
          }

          cleanup_components() {
            dir="$1"
            [ -d "$dir" ] || return 0
            /usr/bin/find "$dir" -maxdepth 1 -type d \( \
              -iname 'AeylaVisualDmx*.component' -o \
              -iname 'AEYLA*DMX*.component' -o \
              -iname 'RGB*AEYLA*.component' \
            \) -print -exec /bin/rm -rf {} + 2>/dev/null || true
          }

          # Remove all known system-level AEYLA plug-in bundles before copying the new one.
          cleanup_dir '/Library/Audio/Plug-Ins/VST3'
          cleanup_components '/Library/Audio/Plug-Ins/Components'

          # Older field builds were sometimes copied manually into the user's Library.
          # Remove only AEYLA/RGB matching bundles; never touch unrelated plug-ins or show data.
          for home in /Users/*; do
            [ -d "$home" ] || continue
            [ "$(basename "$home")" = 'Shared' ] && continue
            cleanup_dir "$home/Library/Audio/Plug-Ins/VST3"
            cleanup_components "$home/Library/Audio/Plug-Ins/Components"
          done

          # R10.10 used the legacy package identifier. Forget stale receipts so macOS
          # does not keep two AEYLA package registrations after the upgrade.
          /usr/sbin/pkgutil --forget com.rgbestudios.aeyla.vst3 >/dev/null 2>&1 || true
          /usr/sbin/pkgutil --forget com.rgbestudios.aeyla.visualdmx >/dev/null 2>&1 || true

          echo 'Legacy AEYLA plug-ins and receipts cleaned.'
          exit 0
          EOF

          cat > "$scripts/postinstall" <<'EOF'
          #!/bin/bash
          set -euo pipefail

          LOG=/var/tmp/AEYLA-installer-cleanup.log
          exec >>"$LOG" 2>&1
          echo "=== AEYLA R10.14 postinstall $(date) ==="

          target='/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3'
          test -d "$target"
          /usr/bin/xattr -dr com.apple.quarantine "$target" 2>/dev/null || true
          /usr/bin/codesign --verify --deep --strict "$target"
          /usr/bin/touch "$target"

          # Final duplicate sweep in user-level VST3 folders. The canonical copy is
          # system-level only; this prevents Ableton from seeing R10.10 and R10.14 together.
          for home in /Users/*; do
            [ -d "$home" ] || continue
            [ "$(basename "$home")" = 'Shared' ] && continue
            dir="$home/Library/Audio/Plug-Ins/VST3"
            [ -d "$dir" ] || continue
            /usr/bin/find "$dir" -maxdepth 1 -type d \( \
              -iname 'AeylaVisualDmx*.vst3' -o \
              -iname 'AEYLA*DMX*.vst3' -o \
              -iname 'RGB*AEYLA*.vst3' \
            \) -print -exec /bin/rm -rf {} + 2>/dev/null || true
          done

          # Refresh macOS audio registration. Ableton may still require its normal plug-in
          # scan on first launch, but no obsolete AEYLA bundle remains on disk.
          /usr/bin/killall -9 AudioComponentRegistrar 2>/dev/null || true

          # Verify exactly one canonical AEYLA VST3 remains in the standard locations.
          count=0
          [ -d "$target" ] && count=$((count + 1))
          for home in /Users/*; do
            [ -d "$home/Library/Audio/Plug-Ins/VST3" ] || continue
            while IFS= read -r legacy; do
              [ -n "$legacy" ] && count=$((count + 1))
            done < <(/usr/bin/find "$home/Library/Audio/Plug-Ins/VST3" -maxdepth 1 -type d \( -iname 'AeylaVisualDmx*.vst3' -o -iname 'AEYLA*DMX*.vst3' -o -iname 'RGB*AEYLA*.vst3' \) -print 2>/dev/null || true)
          done
          if [ "$count" -ne 1 ]; then
            echo "ERROR: expected exactly one AEYLA VST3, found $count"
            exit 1
          fi

          echo 'AEYLA R10.14 installed as the single canonical VST3.'
          exit 0
          EOF

          chmod +x "$scripts/preinstall" "$scripts/postinstall"
          pkg="$dmgroot/Instalar-AEYLA-R10.14.0.pkg"
          pkgbuild --root "$root" --scripts "$scripts" --identifier com.rgbestudios.aeyla.visualdmx --version 10.14.0 "$pkg"
          printf '%s\n' \
            'RGB Estudios - AEYLA R10.14 - DAW Session Recovery' \
            '' \
            'El instalador reemplaza automaticamente instalaciones AEYLA antiguas.' \
            'Limpia copias VST3/Component de AEYLA en /Library y ~/Library y elimina el receipt legado R10.10.' \
            'No borra sesiones Ableton, .aeylashow, TOMAS_DMX, .aeylatake ni datos de usuario.' \
            '' \
            'Save/Save As conserva biblioteca, tomas, MIDI, blackout y el ARM guardado.' \
            'El ARM solo se recupera tras validar proyecto, toma, universo, Art-Net y heartbeat.' \
            'Abrir la sesion NO inicia PLAY: queda lista para el siguiente trigger.' \
            'El archivo .aeylashow portable sigue abriendo desarmado por seguridad.' \
            '' \
            'Firma ad-hoc; no notarizado con Apple Developer ID.' > "$dmgroot/LEEME.txt"
          dmg="$out/RGB-Live-Control-AEYLA-R10.14.0-macOS-DAW-Session-Recovery-Candidate.dmg"
          hdiutil create -volname 'AEYLA R10.14' -srcfolder "$dmgroot" -ov -format UDZO "$dmg"
          shasum -a 256 "$dmg" | tee "$dmg.sha256"
          git diff HEAD^..HEAD > "$out/R10.14-materialized-source.patch" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEYLA-R10.14.0-macOS-DAW-Session-Recovery-Candidate
          path: |
            dist/RGB-Live-Control-AEYLA-R10.14.0-macOS-DAW-Session-Recovery-Candidate.dmg
            dist/RGB-Live-Control-AEYLA-R10.14.0-macOS-DAW-Session-Recovery-Candidate.dmg.sha256
            dist/R10.14-materialized-source.patch
          if-no-files-found: error
