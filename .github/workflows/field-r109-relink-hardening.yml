name: field-r109-relink-hardening

on:
  push:
    branches:
      - field/r10.9-macos-portability-live-memory-20260907

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-safe relink cleanup
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Keep dependencies owned by the class that actually uses them.
          replace_once(
              'product/AeylaVisualDmx/AeylaVisualDmx.h',
              '#include "AeylaNetworkConfiguration.h"\n#include "AeylaLiveMemorySession.h"\n',
              '#include "AeylaNetworkConfiguration.h"\n#include "AeylaLiveMemorySession.h"\n#include "AeylaTakeLibrarySession.h"\n')
          replace_once(
              'product/AeylaVisualDmx/AeylaVisualDmx.h',
              '#include <thread>\n#include <mutex>\n',
              '#include <thread>\n#include <utility>\n#include <mutex>\n')
          replace_once(
              'product/AeylaVisualDmx/AeylaLiveMemorySession.h',
              '#include "runtime/host_event.h"\n#include "AeylaTakeLibrarySession.h"\n',
              '#include "runtime/host_event.h"\n')
          replace_once(
              'product/AeylaVisualDmx/AeylaLiveMemorySession.h',
              '#include <string_view>\n#include <utility>\n',
              '#include <string_view>\n')

          old = '''    {
              const std::scoped_lock lock(mModelMutex);
              aeyla::take_library_session::ensure_scope(
                  this, mModel.project_document().project_id);
            }
            aeyla::take_library_session::set_directory(this, directory);
            const auto restored =
                aeyla::take_library_session::restore_persisted_state(this);
            {
              const std::scoped_lock lock(mModelMutex);
              RefreshHostStateCacheLocked();
            }

            const auto scan = aeyla::capture::scan_take_directory(directory, {});
            if(!scan.ok())
              return {false, {}, "VINCULAR TOMAS · " + scan.error};
            if(scan.entries.empty())
              return {false, {}, "VINCULAR TOMAS · la carpeta no contiene archivos .aeylatake válidos"};

            std::string message = "BIBLIOTECA DMX VINCULADA · " +
                std::to_string(scan.entries.size()) + " TOMAS";
            if(restored.restored_bindings > 0U || restored.missing_bindings > 0U)
              message += " · " + std::to_string(restored.restored_bindings) +
                  " ASOCIACIONES RESTAURADAS" +
                  (restored.missing_bindings == 0U
                       ? std::string{}
                       : " · " + std::to_string(restored.missing_bindings) +
                             " PENDIENTES");
            return {true, {}, std::move(message)};
'''
          new = '''    // Validate the complete destination before changing the active library.
            // A wrong/empty folder must never discard a working association.
            const auto scan = aeyla::capture::scan_take_directory(directory, {});
            if(!scan.ok())
              return {false, {}, "VINCULAR TOMAS · " + scan.error};
            if(scan.entries.empty())
              return {false, {}, "VINCULAR TOMAS · la carpeta no contiene archivos .aeylatake válidos"};

            {
              const std::scoped_lock lock(mModelMutex);
              aeyla::take_library_session::ensure_scope(
                  this, mModel.project_document().project_id);
            }
            // set_directory() is the single restore operation: it resolves pending
            // basename + trim bindings against this exact Mac/Windows directory.
            aeyla::take_library_session::set_directory(this, directory);
            {
              const std::scoped_lock lock(mModelMutex);
              RefreshHostStateCacheLocked();
            }

            return {true, {}, "BIBLIOTECA DMX VINCULADA · " +
                                std::to_string(scan.entries.size()) + " TOMAS"};
'''
          replace_once('product/AeylaVisualDmx/AeylaVisualDmx.h', old, new)

      - name: Patch hygiene
        run: |
          git diff --check
          grep -q 'Validate the complete destination before changing the active library' product/AeylaVisualDmx/AeylaVisualDmx.h
          test "$(grep -c 'restore_persisted_state(this)' product/AeylaVisualDmx/AeylaVisualDmx.h || true)" -eq 0

      - name: Configure core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build and run Take + live-memory regressions
        run: |
          cmake --build build --target aeyla_take_file_tests aeyla_live_memory_session_tests --config Release -j 2
          ctest --test-dir build -R '^(aeyla_take_file_tests|aeyla_live_memory_session_tests)$' --output-on-failure

      - name: Commit product cleanup and remove this one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/field-r109-relink-hardening.yml
          git add product/AeylaVisualDmx/AeylaVisualDmx.h product/AeylaVisualDmx/AeylaLiveMemorySession.h
          git commit -m 'fix: validate take library before cross-platform relink'
          git push origin HEAD:${GITHUB_REF_NAME}
