name: r106-apply-state-semantics-live-ux

on:
  push:
    branches:
      - rgb/r10.6-pro-ui-stabilization-20260830
    paths:
      - patches/r106_state_semantics_and_live_ux.py
      - .github/workflows/r106-apply-state-semantics-live-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.6-pro-ui-stabilization-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Apply state semantics and live UX hardening
        run: |
          python patches/r106_state_semantics_and_live_ux.py
          git diff --check
          git config user.name "rgb-estudios-r10.6-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product/AeylaVisualDmx/AeylaVisualDmx.cpp
          git add product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          git add product/AeylaVisualDmx/AeylaMainControl.h
          git rm patches/r106_state_semantics_and_live_ux.py
          git rm .github/workflows/r106-apply-state-semantics-live-ux.yml
          git diff --cached --quiet && { echo "No R10.6 changes produced"; exit 1; }
          git commit -m "fix(r10.6): align operator state semantics and live UX"
          git push origin HEAD:rgb/r10.6-pro-ui-stabilization-20260830
