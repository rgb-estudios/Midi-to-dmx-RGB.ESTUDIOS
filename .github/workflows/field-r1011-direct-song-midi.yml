name: field-r1011-direct-song-midi

on:
  push:
    branches:
      - field/r10.11-direct-song-midi-20260908

permissions:
  contents: read

env:
  AEYLA_SOURCE_SHA: 0a24610c4ad970bc71f6be3c0e37878f5c7f7970
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0

jobs:
  macos:
    name: R10.11 macOS Universal / direct song MIDI / validator / DMG
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AEYLA_SOURCE_SHA }}

      - name: Apply R10.11 direct per-song MIDI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {n}: {old[:80]!r}")
              p.write_text(s.replace(old, new, count))

          # ---- portable host/session state: add 15 independent song trigger notes ----
          replace('src/runtime/plugin_state.h',
              'inline constexpr std::uint16_t kPluginStateFormatMinor = 4;',
              'inline constexpr std::uint16_t kPluginStateFormatMinor = 5;')
          replace('src/runtime/plugin_state.h',
              '  ShowMidiMapping show_midi{};\n  std::string take_library_locator{};',
              '  ShowMidiMapping show_midi{};\n'
              '  // R10.11: each song owns an independent MIDI Note On trigger.\n'
              '  // Defaults reproduce the former contiguous N48..N62 bank, while\n'
              '  // 1.5 persistence allows every song to be learned independently.\n'
              '  std::array<std::uint8_t, kShowMidiSongCapacity> song_launch_notes{\n'
              '      48U, 49U, 50U, 51U, 52U, 53U, 54U, 55U,\n'
              '      56U, 57U, 58U, 59U, 60U, 61U, 62U};\n'
              '  std::string take_library_locator{};')

          replace('src/runtime/plugin_state.cpp',
              '  if (validate_show_midi_mapping(state.show_midi) !=\n      ShowMidiMappingError::none)\n    return PluginStateError::invalid_show_midi_mapping;\n',
              '  if (validate_show_midi_mapping(state.show_midi) !=\n'
              '      ShowMidiMappingError::none)\n'
              '    return PluginStateError::invalid_show_midi_mapping;\n'
              '  {\n'
              '    std::set<std::uint8_t> used{\n'
              '        state.show_midi.previous_note, state.show_midi.next_note,\n'
              '        state.show_midi.play_note, state.show_midi.pause_note,\n'
              '        state.show_midi.stop_note, state.show_midi.capture_start_note,\n'
              '        state.show_midi.capture_stop_note, kShowMidiPanicNote};\n'
              '    for (const auto note : state.song_launch_notes) {\n'
              '      if (note > 127U || !used.insert(note).second)\n'
              '        return PluginStateError::invalid_show_midi_mapping;\n'
              '    }\n'
              '  }\n')
          replace('src/runtime/plugin_state.cpp',
              '      kFixedPayloadSize + locator_size + binding_bytes + 8U +\n      take_binding_bytes + 2U);',
              '      kFixedPayloadSize + locator_size + binding_bytes + 8U +\n'
              '      take_binding_bytes + 2U + kShowMidiSongCapacity);')
          replace('src/runtime/plugin_state.cpp',
              '    result.bytes.push_back(state.show_midi.capture_start_note);\n    result.bytes.push_back(state.show_midi.capture_stop_note);',
              '    result.bytes.push_back(state.show_midi.capture_start_note);\n'
              '    result.bytes.push_back(state.show_midi.capture_stop_note);\n'
              '    // State 1.5: arbitrary direct launch note per song.\n'
              '    result.bytes.insert(result.bytes.end(), state.song_launch_notes.begin(),\n'
              '                        state.song_launch_notes.end());')
          replace('src/runtime/plugin_state.cpp',
              '  // Same-major future minor versions may append fields inside payload_size.\n',
              '  if (format_minor >= 5U) {\n'
              '    if (offset + kShowMidiSongCapacity > payload_end) {\n'
              '      result.error = PluginStateError::invalid_show_midi_mapping;\n'
              '      return result;\n'
              '    }\n'
              '    std::copy_n(bytes.begin() + static_cast<std::ptrdiff_t>(offset),\n'
              '                kShowMidiSongCapacity, result.state.song_launch_notes.begin());\n'
              '    offset += kShowMidiSongCapacity;\n'
              '  } else if (format_minor >= 2U) {\n'
              '    // Migrate R10.10 and older states from the old contiguous launch bank.\n'
              '    for (std::size_t index = 0U; index < kShowMidiSongCapacity; ++index)\n'
              '      result.state.song_launch_notes[index] = static_cast<std::uint8_t>(\n'
              '          result.state.show_midi.launch_base_note + index);\n'
              '  }\n\n'
              '  // Same-major future minor versions may append fields inside payload_size.\n')

          # ---- plugin realtime mirror + public selected-song note ----
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '  [[nodiscard]] aeyla::runtime::ShowMidiMapping ShowMidiMapping() const noexcept;\n',
              '  [[nodiscard]] aeyla::runtime::ShowMidiMapping ShowMidiMapping() const noexcept;\n'
              '  [[nodiscard]] std::uint8_t SongMidiLaunchNote(std::size_t songIndex) const noexcept;\n')
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '  void SyncShowMidiMappingToState(\n      const aeyla::runtime::ShowMidiMapping& mapping);\n',
              '  void SyncShowMidiMappingToState(\n'
              '      const aeyla::runtime::ShowMidiMapping& mapping);\n'
              '  void SyncSongMidiLaunchNotesToState(\n'
              '      const std::array<std::uint8_t, aeyla::runtime::kShowMidiSongCapacity>& notes);\n')
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '  std::atomic<std::uint64_t> mShowMidiMappingPacked{0U};\n',
              '  std::atomic<std::uint64_t> mShowMidiMappingPacked{0U};\n'
              '  std::array<std::atomic<std::uint8_t>,\n'
              '             aeyla::runtime::kShowMidiSongCapacity> mShowMidiLaunchNotes{};\n')

          # Portable .aeylashow restore must publish the independent notes to realtime MIDI.
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '        mHostStateCache.show_midi = decoded.state.show_midi;\n        mHostStateCache.take_library_locator.clear();',
              '        mHostStateCache.show_midi = decoded.state.show_midi;\n'
              '        mHostStateCache.song_launch_notes = decoded.state.song_launch_notes;\n'
              '        mHostStateCache.take_library_locator.clear();')
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '      mShowMidiCaptureStopNote.store(decoded.state.show_midi.capture_stop_note,\n                                     std::memory_order_release);\n      mMidiPreflightCursor.store',
              '      mShowMidiCaptureStopNote.store(decoded.state.show_midi.capture_stop_note,\n'
              '                                     std::memory_order_release);\n'
              '      for(std::size_t index = 0U; index < aeyla::runtime::kShowMidiSongCapacity; ++index)\n'
              '        mShowMidiLaunchNotes[index].store(decoded.state.song_launch_notes[index],\n'
              '                                         std::memory_order_release);\n'
              '      mMidiPreflightCursor.store')

          # Constructor and normal host-state restore mirror the independent notes.
          replace('product/AeylaVisualDmx/AeylaVisualDmx.cpp',
              '  mShowMidiCaptureStopNote.store(mHostStateCache.show_midi.capture_stop_note,\n                                 std::memory_order_release);\n\n#if IPLUG_EDITOR',
              '  mShowMidiCaptureStopNote.store(mHostStateCache.show_midi.capture_stop_note,\n'
              '                                 std::memory_order_release);\n'
              '  for(std::size_t index = 0U; index < aeyla::runtime::kShowMidiSongCapacity; ++index)\n'
              '    mShowMidiLaunchNotes[index].store(mHostStateCache.song_launch_notes[index],\n'
              '                                     std::memory_order_release);\n\n'
              '#if IPLUG_EDITOR')
          replace('product/AeylaVisualDmx/AeylaVisualDmx.cpp',
              '  mShowMidiCaptureStopNote.store(pending->show_midi.capture_stop_note,\n                                 std::memory_order_release);\n  mMidiPreflightCursor.store',
              '  mShowMidiCaptureStopNote.store(pending->show_midi.capture_stop_note,\n'
              '                                 std::memory_order_release);\n'
              '  for(std::size_t index = 0U; index < aeyla::runtime::kShowMidiSongCapacity; ++index)\n'
              '    mShowMidiLaunchNotes[index].store(pending->song_launch_notes[index],\n'
              '                                     std::memory_order_release);\n'
              '  mMidiPreflightCursor.store')

          # Realtime MIDI: independent note array is authoritative; old base range is swallowed.
          replace('product/AeylaVisualDmx/AeylaVisualDmx.cpp',
              '    aeyla::runtime::ShowMidiMatch showMatch{};\n    const auto showMapping = ShowMidiMapping();\n    const bool mappedShowNote = aeyla::runtime::match_show_midi_note(\n        showMapping, channel, midiNote, 127U, showMatch);\n    if(mappedShowNote)\n',
              '    aeyla::runtime::ShowMidiMatch showMatch{};\n'
              '    const auto showMapping = ShowMidiMapping();\n'
              '    bool mappedShowNote = false;\n'
              '    if(showMapping.enabled && channel == showMapping.channel)\n'
              '    {\n'
              '      for(std::size_t index = 0U; index < aeyla::runtime::kShowMidiSongCapacity; ++index)\n'
              '      {\n'
              '        if(midiNote == mShowMidiLaunchNotes[index].load(std::memory_order_acquire))\n'
              '        {\n'
              '          showMatch.command = aeyla::runtime::ShowMidiCommand::launch_song;\n'
              '          showMatch.song_index = static_cast<std::uint8_t>(index);\n'
              '          mappedShowNote = true;\n'
              '          break;\n'
              '        }\n'
              '      }\n'
              '    }\n'
              '    if(!mappedShowNote)\n'
              '    {\n'
              '      mappedShowNote = aeyla::runtime::match_show_midi_note(\n'
              '          showMapping, channel, midiNote, 127U, showMatch);\n'
              '      // R10.11 replaces the old contiguous launch bank with the\n'
              '      // independent per-song array. Do not let stale base-range notes launch.\n'
              '      if(mappedShowNote && showMatch.command == aeyla::runtime::ShowMidiCommand::launch_song)\n'
              '        return;\n'
              '    }\n'
              '    if(mappedShowNote)\n')

          # ---- MIDI SHOW authoring: existing launch row now learns selected song only ----
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp',
              '    case Target::launch_song_base: return "BASE DE 15 CANCIONES";',
              '    case Target::launch_song_base: return "CANCIÓN SELECCIONADA";')
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp',
              '}  // namespace\n\naeyla::runtime::ShowMidiMapping AeylaVisualDmx::ShowMidiMapping() const noexcept',
              '''bool ValidateSongLaunchLayout(\n    const aeyla::runtime::ShowMidiMapping& mapping,\n    const std::array<std::uint8_t, aeyla::runtime::kShowMidiSongCapacity>& notes,\n    std::string& error) {\n  if(mapping.channel < 1U || mapping.channel > 16U) {\n    error = "Canal MIDI fuera de rango";\n    return false;\n  }\n  std::set<std::uint8_t> used{\n      mapping.previous_note, mapping.next_note, mapping.play_note,\n      mapping.pause_note, mapping.stop_note, mapping.capture_start_note,\n      mapping.capture_stop_note, aeyla::runtime::kShowMidiPanicNote};\n  for(std::size_t index = 0U; index < notes.size(); ++index) {\n    if(notes[index] > 127U) {\n      error = "Nota de canción fuera de rango";\n      return false;\n    }\n    if(!used.insert(notes[index]).second) {\n      error = "La nota " + std::to_string(notes[index]) +\n              " ya está ocupada por otro control o canción";\n      return false;\n    }\n  }\n  return true;\n}\n\n}  // namespace\n\naeyla::runtime::ShowMidiMapping AeylaVisualDmx::ShowMidiMapping() const noexcept''')
          # Need <set> for layout validation.
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp',
              '#include <optional>\n#include <string>',
              '#include <optional>\n#include <set>\n#include <string>')
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp',
              '  return mapping;\n}\n\nvoid AeylaVisualDmx::SetShowMidiMessage',
              '''  return mapping;\n}\n\nstd::uint8_t AeylaVisualDmx::SongMidiLaunchNote(std::size_t songIndex) const noexcept\n{\n  if(songIndex >= aeyla::runtime::kShowMidiSongCapacity)\n    return 0U;\n  return mShowMidiLaunchNotes[songIndex].load(std::memory_order_acquire);\n}\n\nvoid AeylaVisualDmx::SyncSongMidiLaunchNotesToState(\n    const std::array<std::uint8_t, aeyla::runtime::kShowMidiSongCapacity>& notes)\n{\n  for(std::size_t index = 0U; index < notes.size(); ++index)\n    mShowMidiLaunchNotes[index].store(notes[index], std::memory_order_release);\n  const std::scoped_lock lock(mHostStateMutex);\n  mHostStateCache.song_launch_notes = notes;\n}\n\nvoid AeylaVisualDmx::SetShowMidiMessage''')

          old_learn = '''    auto mapping = ShowMidiMapping();\n    std::string error;\n    if(aeyla::runtime::assign_show_midi_note(\n           mapping, target, channel, note, error)) {\n      mModel.release_transients();\n      SyncShowMidiMappingToState(mapping);\n      SetShowMidiMessage(std::string("MIDI APRENDIDO · ") +\n                         LearnTargetName(target) + " = nota " +\n                         std::to_string(note) + " · canal " +\n                         std::to_string(channel));\n    }\n    else {\n      SetShowMidiMessage("MIDI NO ASIGNADO · " + error);\n    }\n'''
          new_learn = '''    auto mapping = ShowMidiMapping();\n    std::array<std::uint8_t, aeyla::runtime::kShowMidiSongCapacity> songNotes{};\n    for(std::size_t index = 0U; index < songNotes.size(); ++index)\n      songNotes[index] = mShowMidiLaunchNotes[index].load(std::memory_order_acquire);\n    std::string error;\n    bool assigned = false;\n    if(target == aeyla::runtime::ShowMidiLearnTarget::launch_song_base) {\n      const auto selected = mModel.snapshot().active_song_index;\n      if(selected >= mModel.snapshot().song_count || selected >= songNotes.size()) {\n        error = "Selecciona una canción válida antes de APRENDER MIDI";\n      } else {\n        auto candidate = mapping;\n        auto candidateNotes = songNotes;\n        candidate.channel = channel;\n        candidateNotes[selected] = note;\n        if(ValidateSongLaunchLayout(candidate, candidateNotes, error)) {\n          mapping = candidate;\n          songNotes = candidateNotes;\n          assigned = true;\n        }\n      }\n    } else if(aeyla::runtime::assign_show_midi_note(\n                  mapping, target, channel, note, error)) {\n      assigned = ValidateSongLaunchLayout(mapping, songNotes, error);\n    }\n    if(assigned) {\n      mModel.release_transients();\n      SyncShowMidiMappingToState(mapping);\n      SyncSongMidiLaunchNotesToState(songNotes);\n      const auto selected = mModel.snapshot().active_song_index;\n      const std::string subject = target == aeyla::runtime::ShowMidiLearnTarget::launch_song_base &&\n              selected < mModel.snapshot().song_count\n          ? mModel.show_program().songs[selected].name\n          : LearnTargetName(target);\n      SetShowMidiMessage(std::string("MIDI APRENDIDO · ") + subject +\n                         " = nota " + std::to_string(note) + " · canal " +\n                         std::to_string(channel) +\n                         (target == aeyla::runtime::ShowMidiLearnTarget::launch_song_base\n                              ? " · DISPARO DIRECTO" : ""));\n    } else {\n      SetShowMidiMessage("MIDI NO ASIGNADO · " + error);\n    }\n'''
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp', old_learn, new_learn)

          # UI: selected song owns the displayed/learned note instead of a base bank.
          replace('product/AeylaVisualDmx/AeylaMainControl.h',
              '        "LANZAR CANCIÓN 01–15"};',
              '        "LANZAR CANCIÓN SELECCIONADA"};')
          replace('product/AeylaVisualDmx/AeylaMainControl.h',
              '        mapping.capture_stop_note, mapping.launch_base_note};',
              '        mapping.capture_stop_note,\n        mPlug.SongMidiLaunchNote(mPlug.ActiveSongIndex())};')

          # Visible build label only; behavior remains R10.10 portable baseline + R10.11 MIDI patch.
          replace('product/AeylaVisualDmx/AeylaRuntimeStatusControl.h',
              'R10.10 PORTABLE PRETEST', 'R10.11 DIRECT MIDI PRETEST')

          print('R10.11 direct-song MIDI patch applied')
          PY

          git diff --check
          git diff --stat
          grep -q 'kPluginStateFormatMinor = 5' src/runtime/plugin_state.h
          grep -q 'LANZAR CANCIÓN SELECCIONADA' product/AeylaVisualDmx/AeylaMainControl.h
          grep -q 'DISPARO DIRECTO' product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp

      - name: Run core regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core --config Release --parallel 2 --target aeyla_project_package_tests aeyla_project_file_controller_tests aeyla_plugin_state_tests aeyla_take_library_session_tests aeyla_live_memory_session_tests aeyla_show_midi_control_tests aeyla_host_song_binding_tests
          ctest --test-dir build-core --output-on-failure -R '^(aeyla_project_package_tests|aeyla_project_file_controller_tests|aeyla_plugin_state_tests|aeyla_take_library_session_tests|aeyla_live_memory_session_tests|aeyla_show_midi_control_tests|aeyla_host_song_binding_tests)$'

      - name: Fetch pinned iPlug2 and Steinberg SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout "$IPLUG2_COMMIT"
          sdk="external/iPlug2/Dependencies/IPlug/VST3_SDK"
          rm -rf "$sdk"
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git "$sdk"
          git -C "$sdk" checkout "$VST3SDK_COMMIT"
          git -C "$sdk" submodule update --init --recursive

      - name: Build Universal VST3
        shell: bash
        run: |
          set -euo pipefail
          cmake -S product -B build-product -G Xcode -DIPLUG2_DIR="$GITHUB_WORKSPACE/external/iPlug2" -DIPLUG2_UNIVERSAL=ON -DIPLUG_DEPLOY_PLUGINS=OFF -DIGRAPHICS_BACKEND=NANOVG -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-product --config Release --target AeylaVisualDmx-vst3 --parallel 2

      - name: Verify Universal and Steinberg Validator
        shell: bash
        run: |
          set -euo pipefail
          vst3="$(find build-product -type d -name 'AeylaVisualDmx.vst3' | head -n 1)"
          bin="$vst3/Contents/MacOS/AeylaVisualDmx"
          test -n "$vst3"
          lipo "$bin" -verify_arch arm64 x86_64
          codesign --force --deep --sign - "$vst3"
          codesign --verify --deep --strict --verbose=2 "$vst3"
          cmake -S external/iPlug2/Dependencies/IPlug/VST3_SDK -B build-validator -G Xcode -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          cmake --build build-validator --config Release --target validator --parallel 2
          validator="$(find build-validator -type f -name validator -perm +111 | head -n 1)"
          "$validator" "$vst3"

      - name: Build R10.11 PKG and DMG
        shell: bash
        run: |
          set -euo pipefail
          vst3="$(find build-product -type d -name 'AeylaVisualDmx.vst3' | head -n 1)"
          root="$GITHUB_WORKSPACE/pkgroot"
          scripts="$GITHUB_WORKSPACE/pkgscripts"
          dmgroot="$GITHUB_WORKSPACE/dmgroot"
          mkdir -p "$root/Library/Audio/Plug-Ins/VST3" "$scripts" "$dmgroot"
          ditto "$vst3" "$root/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3"
          cat > "$scripts/preinstall" <<'EOF'
          #!/bin/bash
          set -e
          rm -rf "/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3"
          exit 0
          EOF
          cat > "$scripts/postinstall" <<'EOF'
          #!/bin/bash
          set -e
          target="/Library/Audio/Plug-Ins/VST3/AeylaVisualDmx.vst3"
          /usr/bin/xattr -dr com.apple.quarantine "$target" 2>/dev/null || true
          /usr/bin/codesign --verify --deep --strict "$target"
          /usr/bin/touch "$target"
          /usr/bin/killall -9 AudioComponentRegistrar 2>/dev/null || true
          exit 0
          EOF
          chmod +x "$scripts/preinstall" "$scripts/postinstall"
          pkgbuild --root "$root" --scripts "$scripts" --identifier 'com.rgbestudios.aeyla.vst3' --version '10.11.0' --install-location '/' "$dmgroot/Install RGB Live Control AEYLA R10.11.pkg"
          cat > "$dmgroot/LEEME PRIMERO.txt" <<'EOF'
          RGB Live Control / AEYLA R10.11.0 — DIRECT SONG MIDI PRETEST

          Baseline: R10.10 portable Windows -> Mac, sin cambiar .aeylatake.

          MIDI SHOW:
          - Selecciona una canción.
          - En MIDI SHOW usa APRENDER MIDI en LANZAR CANCIÓN SELECCIONADA.
          - Toca cualquier nota libre del canal elegido.
          - Repite para cada canción: cada canción puede tener una nota diferente.
          - En vivo, NOTE ON selecciona + reproduce esa toma inmediatamente cuando el transporte de Ableton está corriendo.
          - NOTE OFF no dispara nada.
          - No necesitas PLAY/GO de AEYLA ni mantener su ventana abierta.
          - Repetir la misma nota reinicia la canción; otra nota cambia de canción y lanza su toma.

          Seguridad: PANIC N41 reservado. ARM Art-Net continúa manual y nunca se restaura automáticamente.
          EOF
          printf 'R10.11.0\nBASE_SOURCE=%s\nFEATURE=DIRECT_PER_SONG_MIDI\nARCHITECTURES=arm64+x86_64\nSTATUS=FIELD_PRETEST\nSIGNING=AD_HOC\n' "$AEYLA_SOURCE_SHA" > "$dmgroot/BUILD_ID.txt"
          hdiutil create -volname 'RGB Live Control AEYLA R10.11' -srcfolder "$dmgroot" -ov -format UDZO "$GITHUB_WORKSPACE/RGB-Live-Control-AEYLA-R10.11.0-macOS-Direct-Song-MIDI-Pretest.dmg"
          hdiutil verify "$GITHUB_WORKSPACE/RGB-Live-Control-AEYLA-R10.11.0-macOS-Direct-Song-MIDI-Pretest.dmg"
          shasum -a 256 "$GITHUB_WORKSPACE/RGB-Live-Control-AEYLA-R10.11.0-macOS-Direct-Song-MIDI-Pretest.dmg" > "$GITHUB_WORKSPACE/RGB-Live-Control-AEYLA-R10.11.0-macOS-Direct-Song-MIDI-Pretest.dmg.sha256"
          git diff > "$GITHUB_WORKSPACE/R10.11-direct-song-midi.patch"

      - uses: actions/upload-artifact@v4
        with:
          name: AEYLA-R10.11.0-macOS-Direct-Song-MIDI-Pretest
          path: |
            RGB-Live-Control-AEYLA-R10.11.0-macOS-Direct-Song-MIDI-Pretest.dmg
            RGB-Live-Control-AEYLA-R10.11.0-macOS-Direct-Song-MIDI-Pretest.dmg.sha256
            R10.11-direct-song-midi.patch
          retention-days: 30
          if-no-files-found: error
