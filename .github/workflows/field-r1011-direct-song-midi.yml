name: validation-r1011-midi-host

on:
  push:
    branches:
      - validation/r10.11-midi-host-20260908

permissions:
  contents: read

env:
  AEYLA_SOURCE_SHA: 0a24610c4ad970bc71f6be3c0e37878f5c7f7970
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0

jobs:
  macos:
    name: R10.11 macOS Universal / direct song MIDI / validator / DMG
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AEYLA_SOURCE_SHA }}

      - name: Apply R10.11 direct per-song MIDI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {n}: {old[:80]!r}")
              p.write_text(s.replace(old, new, count))

          # ---- portable host/session state: add 15 independent song trigger notes ----
          replace('src/runtime/plugin_state.h',
              'inline constexpr std::uint16_t kPluginStateFormatMinor = 4;',
              'inline constexpr std::uint16_t kPluginStateFormatMinor = 5;')
          replace('src/runtime/plugin_state.h',
              '  ShowMidiMapping show_midi{};\n  std::string take_library_locator{};',
              '  ShowMidiMapping show_midi{};\n'
              '  // R10.11: each song owns an independent MIDI Note On trigger.\n'
              '  // Defaults reproduce the former contiguous N48..N62 bank, while\n'
              '  // 1.5 persistence allows every song to be learned independently.\n'
              '  std::array<std::uint8_t, kShowMidiSongCapacity> song_launch_notes{\n'
              '      48U, 49U, 50U, 51U, 52U, 53U, 54U, 55U,\n'
              '      56U, 57U, 58U, 59U, 60U, 61U, 62U};\n'
              '  std::string take_library_locator{};')

          replace('src/runtime/plugin_state.cpp',
              '  if (validate_show_midi_mapping(state.show_midi) !=\n      ShowMidiMappingError::none)\n    return PluginStateError::invalid_show_midi_mapping;\n',
              '  if (validate_show_midi_mapping(state.show_midi) !=\n'
              '      ShowMidiMappingError::none)\n'
              '    return PluginStateError::invalid_show_midi_mapping;\n'
              '  {\n'
              '    std::set<std::uint8_t> used{\n'
              '        state.show_midi.previous_note, state.show_midi.next_note,\n'
              '        state.show_midi.play_note, state.show_midi.pause_note,\n'
              '        state.show_midi.stop_note, state.show_midi.capture_start_note,\n'
              '        state.show_midi.capture_stop_note, kShowMidiPanicNote};\n'
              '    for (const auto note : state.song_launch_notes) {\n'
              '      if (note > 127U || !used.insert(note).second)\n'
              '        return PluginStateError::invalid_show_midi_mapping;\n'
              '    }\n'
              '  }\n')
          replace('src/runtime/plugin_state.cpp',
              '      kFixedPayloadSize + locator_size + binding_bytes + 8U +\n      take_binding_bytes + 2U);',
              '      kFixedPayloadSize + locator_size + binding_bytes + 8U +\n'
              '      take_binding_bytes + 2U + kShowMidiSongCapacity);')
          replace('src/runtime/plugin_state.cpp',
              '    result.bytes.push_back(state.show_midi.capture_start_note);\n    result.bytes.push_back(state.show_midi.capture_stop_note);',
              '    result.bytes.push_back(state.show_midi.capture_start_note);\n'
              '    result.bytes.push_back(state.show_midi.capture_stop_note);\n'
              '    // State 1.5: arbitrary direct launch note per song.\n'
              '    result.bytes.insert(result.bytes.end(), state.song_launch_notes.begin(),\n'
              '                        state.song_launch_notes.end());')
          replace('src/runtime/plugin_state.cpp',
              '  // Same-major future minor versions may append fields inside payload_size.\n',
              '  if (format_minor >= 5U) {\n'
              '    if (offset + kShowMidiSongCapacity > payload_end) {\n'
              '      result.error = PluginStateError::invalid_show_midi_mapping;\n'
              '      return result;\n'
              '    }\n'
              '    std::copy_n(bytes.begin() + static_cast<std::ptrdiff_t>(offset),\n'
              '                kShowMidiSongCapacity, result.state.song_launch_notes.begin());\n'
              '    offset += kShowMidiSongCapacity;\n'
              '  } else if (format_minor >= 2U) {\n'
              '    // Migrate R10.10 and older states from the old contiguous launch bank.\n'
              '    for (std::size_t index = 0U; index < kShowMidiSongCapacity; ++index)\n'
              '      result.state.song_launch_notes[index] = static_cast<std::uint8_t>(\n'
              '          result.state.show_midi.launch_base_note + index);\n'
              '  }\n\n'
              '  // Same-major future minor versions may append fields inside payload_size.\n')

          # ---- plugin realtime mirror + public selected-song note ----
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '  [[nodiscard]] aeyla::runtime::ShowMidiMapping ShowMidiMapping() const noexcept;\n',
              '  [[nodiscard]] aeyla::runtime::ShowMidiMapping ShowMidiMapping() const noexcept;\n'
              '  [[nodiscard]] std::uint8_t SongMidiLaunchNote(std::size_t songIndex) const noexcept;\n')
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '  void SyncShowMidiMappingToState(\n      const aeyla::runtime::ShowMidiMapping& mapping);\n',
              '  void SyncShowMidiMappingToState(\n'
              '      const aeyla::runtime::ShowMidiMapping& mapping);\n'
              '  void SyncSongMidiLaunchNotesToState(\n'
              '      const std::array<std::uint8_t, aeyla::runtime::kShowMidiSongCapacity>& notes);\n')
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '  std::atomic<std::uint64_t> mShowMidiMappingPacked{0U};\n',
              '  std::atomic<std::uint64_t> mShowMidiMappingPacked{0U};\n'
              '  std::array<std::atomic<std::uint8_t>,\n'
              '             aeyla::runtime::kShowMidiSongCapacity> mShowMidiLaunchNotes{};\n')

          # Portable .aeylashow restore must publish the independent notes to realtime MIDI.
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '        mHostStateCache.show_midi = decoded.state.show_midi;\n        mHostStateCache.take_library_locator.clear();',
              '        mHostStateCache.show_midi = decoded.state.show_midi;\n'
              '        mHostStateCache.song_launch_notes = decoded.state.song_launch_notes;\n'
              '        mHostStateCache.take_library_locator.clear();')
          replace('product/AeylaVisualDmx/AeylaVisualDmx.h',
              '      mShowMidiCaptureStopNote.store(decoded.state.show_midi.capture_stop_note,\n                                     std::memory_order_release);\n      mMidiPreflightCursor.store',
              '      mShowMidiCaptureStopNote.store(decoded.state.show_midi.capture_stop_note,\n'
              '                                     std::memory_order_release);\n'
              '      for(std::size_t index = 0U; index < aeyla::runtime::kShowMidiSongCapacity; ++index)\n'
              '        mShowMidiLaunchNotes[index].store(decoded.state.song_launch_notes[index],\n'
              '                                         std::memory_order_release);\n'
              '      mMidiPreflightCursor.store')

          # Constructor and normal host-state restore mirror the independent notes.
          replace('product/AeylaVisualDmx/AeylaVisualDmx.cpp',
              '  mShowMidiCaptureStopNote.store(mHostStateCache.show_midi.capture_stop_note,\n                                 std::memory_order_release);\n\n#if IPLUG_EDITOR',
              '  mShowMidiCaptureStopNote.store(mHostStateCache.show_midi.capture_stop_note,\n'
              '                                 std::memory_order_release);\n'
              '  for(std::size_t index = 0U; index < aeyla::runtime::kShowMidiSongCapacity; ++index)\n'
              '    mShowMidiLaunchNotes[index].store(mHostStateCache.song_launch_notes[index],\n'
              '                                     std::memory_order_release);\n\n'
              '#if IPLUG_EDITOR')
          replace('product/AeylaVisualDmx/AeylaVisualDmx.cpp',
              '  mShowMidiCaptureStopNote.store(pending->show_midi.capture_stop_note,\n                                 std::memory_order_release);\n  mMidiPreflightCursor.store',
              '  mShowMidiCaptureStopNote.store(pending->show_midi.capture_stop_note,\n'
              '                                 std::memory_order_release);\n'
              '  for(std::size_t index = 0U; index < aeyla::runtime::kShowMidiSongCapacity; ++index)\n'
              '    mShowMidiLaunchNotes[index].store(pending->song_launch_notes[index],\n'
              '                                     std::memory_order_release);\n'
              '  mMidiPreflightCursor.store')

          # Realtime MIDI: independent note array is authoritative; old base range is swallowed.
          replace('product/AeylaVisualDmx/AeylaVisualDmx.cpp',
              '    aeyla::runtime::ShowMidiMatch showMatch{};\n    const auto showMapping = ShowMidiMapping();\n    const bool mappedShowNote = aeyla::runtime::match_show_midi_note(\n        showMapping, channel, midiNote, 127U, showMatch);\n    if(mappedShowNote)\n',
              '    aeyla::runtime::ShowMidiMatch showMatch{};\n'
              '    const auto showMapping = ShowMidiMapping();\n'
              '    bool mappedShowNote = false;\n'
              '    if(showMapping.enabled && channel == showMapping.channel)\n'
              '    {\n'
              '      for(std::size_t index = 0U; index < aeyla::runtime::kShowMidiSongCapacity; ++index)\n'
              '      {\n'
              '        if(midiNote == mShowMidiLaunchNotes[index].load(std::memory_order_acquire))\n'
              '        {\n'
              '          showMatch.command = aeyla::runtime::ShowMidiCommand::launch_song;\n'
              '          showMatch.song_index = static_cast<std::uint8_t>(index);\n'
              '          mappedShowNote = true;\n'
              '          break;\n'
              '        }\n'
              '      }\n'
              '    }\n'
              '    if(!mappedShowNote)\n'
              '    {\n'
              '      mappedShowNote = aeyla::runtime::match_show_midi_note(\n'
              '          showMapping, channel, midiNote, 127U, showMatch);\n'
              '      // R10.11 replaces the old contiguous launch bank with the\n'
              '      // independent per-song array. Do not let stale base-range notes launch.\n'
              '      if(mappedShowNote && showMatch.command == aeyla::runtime::ShowMidiCommand::launch_song)\n'
              '        return;\n'
              '    }\n'
              '    if(mappedShowNote)\n')

          # ---- MIDI SHOW authoring: existing launch row now learns selected song only ----
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp',
              '    case Target::launch_song_base: return "BASE DE 15 CANCIONES";',
              '    case Target::launch_song_base: return "CANCIÓN SELECCIONADA";')
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp',
              '}  // namespace\n\naeyla::runtime::ShowMidiMapping AeylaVisualDmx::ShowMidiMapping() const noexcept',
              '''bool ValidateSongLaunchLayout(\n    const aeyla::runtime::ShowMidiMapping& mapping,\n    const std::array<std::uint8_t, aeyla::runtime::kShowMidiSongCapacity>& notes,\n    std::string& error) {\n  if(mapping.channel < 1U || mapping.channel > 16U) {\n    error = "Canal MIDI fuera de rango";\n    return false;\n  }\n  std::set<std::uint8_t> used{\n      mapping.previous_note, mapping.next_note, mapping.play_note,\n      mapping.pause_note, mapping.stop_note, mapping.capture_start_note,\n      mapping.capture_stop_note, aeyla::runtime::kShowMidiPanicNote};\n  for(std::size_t index = 0U; index < notes.size(); ++index) {\n    if(notes[index] > 127U) {\n      error = "Nota de canción fuera de rango";\n      return false;\n    }\n    if(!used.insert(notes[index]).second) {\n      error = "La nota " + std::to_string(notes[index]) +\n              " ya está ocupada por otro control o canción";\n      return false;\n    }\n  }\n  return true;\n}\n\n}  // namespace\n\naeyla::runtime::ShowMidiMapping AeylaVisualDmx::ShowMidiMapping() const noexcept''')
          # Need <set> for layout validation.
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp',
              '#include <optional>\n#include <string>',
              '#include <optional>\n#include <set>\n#include <string>')
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp',
              '  return mapping;\n}\n\nvoid AeylaVisualDmx::SetShowMidiMessage',
              '''  return mapping;\n}\n\nstd::uint8_t AeylaVisualDmx::SongMidiLaunchNote(std::size_t songIndex) const noexcept\n{\n  if(songIndex >= aeyla::runtime::kShowMidiSongCapacity)\n    return 0U;\n  return mShowMidiLaunchNotes[songIndex].load(std::memory_order_acquire);\n}\n\nvoid AeylaVisualDmx::SyncSongMidiLaunchNotesToState(\n    const std::array<std::uint8_t, aeyla::runtime::kShowMidiSongCapacity>& notes)\n{\n  for(std::size_t index = 0U; index < notes.size(); ++index)\n    mShowMidiLaunchNotes[index].store(notes[index], std::memory_order_release);\n  const std::scoped_lock lock(mHostStateMutex);\n  mHostStateCache.song_launch_notes = notes;\n}\n\nvoid AeylaVisualDmx::SetShowMidiMessage''')

          old_learn = '''    auto mapping = ShowMidiMapping();\n    std::string error;\n    if(aeyla::runtime::assign_show_midi_note(\n           mapping, target, channel, note, error)) {\n      mModel.release_transients();\n      SyncShowMidiMappingToState(mapping);\n      SetShowMidiMessage(std::string("MIDI APRENDIDO · ") +\n                         LearnTargetName(target) + " = nota " +\n                         std::to_string(note) + " · canal " +\n                         std::to_string(channel));\n    }\n    else {\n      SetShowMidiMessage("MIDI NO ASIGNADO · " + error);\n    }\n'''
          new_learn = '''    auto mapping = ShowMidiMapping();\n    std::array<std::uint8_t, aeyla::runtime::kShowMidiSongCapacity> songNotes{};\n    for(std::size_t index = 0U; index < songNotes.size(); ++index)\n      songNotes[index] = mShowMidiLaunchNotes[index].load(std::memory_order_acquire);\n    std::string error;\n    bool assigned = false;\n    if(target == aeyla::runtime::ShowMidiLearnTarget::launch_song_base) {\n      const auto selected = mModel.snapshot().active_song_index;\n      if(selected >= mModel.snapshot().song_count || selected >= songNotes.size()) {\n        error = "Selecciona una canción válida antes de APRENDER MIDI";\n      } else {\n        auto candidate = mapping;\n        auto candidateNotes = songNotes;\n        candidate.channel = channel;\n        candidateNotes[selected] = note;\n        if(ValidateSongLaunchLayout(candidate, candidateNotes, error)) {\n          mapping = candidate;\n          songNotes = candidateNotes;\n          assigned = true;\n        }\n      }\n    } else if(aeyla::runtime::assign_show_midi_note(\n                  mapping, target, channel, note, error)) {\n      assigned = ValidateSongLaunchLayout(mapping, songNotes, error);\n    }\n    if(assigned) {\n      mModel.release_transients();\n      SyncShowMidiMappingToState(mapping);\n      SyncSongMidiLaunchNotesToState(songNotes);\n      const auto selected = mModel.snapshot().active_song_index;\n      const std::string subject = target == aeyla::runtime::ShowMidiLearnTarget::launch_song_base &&\n              selected < mModel.snapshot().song_count\n          ? mModel.show_program().songs[selected].name\n          : LearnTargetName(target);\n      SetShowMidiMessage(std::string("MIDI APRENDIDO · ") + subject +\n                         " = nota " + std::to_string(note) + " · canal " +\n                         std::to_string(channel) +\n                         (target == aeyla::runtime::ShowMidiLearnTarget::launch_song_base\n                              ? " · DISPARO DIRECTO" : ""));\n    } else {\n      SetShowMidiMessage("MIDI NO ASIGNADO · " + error);\n    }\n'''
          replace('product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp', old_learn, new_learn)

          # UI: selected song owns the displayed/learned note instead of a base bank.
          replace('product/AeylaVisualDmx/AeylaMainControl.h',
              '        "LANZAR CANCIÓN 01–15"};',
              '        "LANZAR CANCIÓN SELECCIONADA"};')
          replace('product/AeylaVisualDmx/AeylaMainControl.h',
              '        mapping.capture_stop_note, mapping.launch_base_note};',
              '        mapping.capture_stop_note,\n        mPlug.SongMidiLaunchNote(mPlug.ActiveSongIndex())};')

          # Visible build label only; behavior remains R10.10 portable baseline + R10.11 MIDI patch.
          replace('product/AeylaVisualDmx/AeylaRuntimeStatusControl.h',
              'R10.10 PORTABLE PRETEST', 'R10.11 DIRECT MIDI PRETEST')

          print('R10.11 direct-song MIDI patch applied')
          PY

          git diff --check
          git diff --stat
          grep -q 'kPluginStateFormatMinor = 5' src/runtime/plugin_state.h
          grep -q 'LANZAR CANCIÓN SELECCIONADA' product/AeylaVisualDmx/AeylaMainControl.h
          grep -q 'DISPARO DIRECTO' product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp

      - name: Add targeted validation cases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("r1011_midi_probe.cpp").write_text('\n#include "runtime/plugin_state.h"\n#include <algorithm>\n#include <array>\n#include <atomic>\n#include <cassert>\n#include <iostream>\n#include <set>\nusing namespace aeyla::runtime;\nstruct IMidiMsg {\n enum {kNoteOn=9,kNoteOff=8}; int status,note,velocity,channel,mOffset=0;\n int StatusMsg()const{return status;} int NoteNumber()const{return note;}\n int Velocity()const{return velocity;} int Channel()const{return channel;}\n};\nstruct AeylaVisualDmx {\n std::atomic<int> mMidiEventCount{0},mLastMidiNote{-1};\n std::atomic<ShowMidiLearnTarget> mShowMidiLearnTarget{ShowMidiLearnTarget::none};\n std::atomic<uint32_t> mPendingMidiLearnPacked{0};\n std::array<std::atomic<uint8_t>,15> mShowMidiLaunchNotes{};\n std::atomic<uint64_t> mProcessedAudioSamples{1000},mProcessedTransportSamples{1000};\n struct Capture{uint64_t recorded_frames_fast(){return 0;}}mArtNetCapture;\n struct Ingress{int count=0; ShowMidiEvent last{};bool try_submit(ShowMidiEvent e){last=e;++count;return true;}}mShowMidiIngress;\n aeyla::runtime::ShowMidiMapping mapping{};\n aeyla::runtime::ShowMidiMapping ShowMidiMapping()const{return mapping;}\n void ProcessMidiMsg(const IMidiMsg& msg);\n AeylaVisualDmx(){mapping.enabled=true;for(int i=0;i<15;++i)mShowMidiLaunchNotes[i]=48+i;}\n};\n\nvoid AeylaVisualDmx::ProcessMidiMsg(const IMidiMsg& msg)\n{\n  const auto status = msg.StatusMsg();\n  const int note = msg.NoteNumber();\n  const int velocity = msg.Velocity();\n\n  if((status == IMidiMsg::kNoteOn || status == IMidiMsg::kNoteOff) && note >= 0)\n  {\n    mMidiEventCount.fetch_add(1, std::memory_order_relaxed);\n    mLastMidiNote.store(note, std::memory_order_relaxed);\n\n    const auto channel = static_cast<std::uint8_t>(\n        std::clamp(msg.Channel() + 1, 1, 16));\n    const auto midiNote = static_cast<std::uint8_t>(std::clamp(note, 0, 127));\n    const bool positiveNoteOn = status == IMidiMsg::kNoteOn && velocity > 0;\n\n    if(positiveNoteOn)\n    {\n      const auto learnTarget = mShowMidiLearnTarget.exchange(\n          aeyla::runtime::ShowMidiLearnTarget::none,\n          std::memory_order_acq_rel);\n      if(learnTarget != aeyla::runtime::ShowMidiLearnTarget::none)\n      {\n        const std::uint32_t packed =\n            static_cast<std::uint32_t>(learnTarget) |\n            (static_cast<std::uint32_t>(channel) << 8U) |\n            (static_cast<std::uint32_t>(midiNote) << 16U) |\n            (1U << 24U);\n        mPendingMidiLearnPacked.store(packed, std::memory_order_release);\n        return;\n      }\n    }\n\n    aeyla::runtime::ShowMidiMatch showMatch{};\n    const auto showMapping = ShowMidiMapping();\n    bool mappedShowNote = false;\n    if(showMapping.enabled && channel == showMapping.channel)\n    {\n      for(std::size_t index = 0U; index < aeyla::runtime::kShowMidiSongCapacity; ++index)\n      {\n        if(midiNote == mShowMidiLaunchNotes[index].load(std::memory_order_acquire))\n        {\n          showMatch.command = aeyla::runtime::ShowMidiCommand::launch_song;\n          showMatch.song_index = static_cast<std::uint8_t>(index);\n          mappedShowNote = true;\n          break;\n        }\n      }\n    }\n    if(!mappedShowNote)\n    {\n      mappedShowNote = aeyla::runtime::match_show_midi_note(\n          showMapping, channel, midiNote, 127U, showMatch);\n      // R10.11 replaces the old contiguous launch bank with the\n      // independent per-song array. Do not let stale base-range notes launch.\n      if(mappedShowNote && showMatch.command == aeyla::runtime::ShowMidiCommand::launch_song)\n        return;\n    }\n    if(mappedShowNote)\n    {\n      if(positiveNoteOn)\n      {\n        const auto completed = mProcessedAudioSamples.load(\n            std::memory_order_acquire);\n        const auto transportCompleted = mProcessedTransportSamples.load(\n            std::memory_order_acquire);\n        const auto offset = static_cast<std::uint32_t>(\n            std::max(msg.mOffset, 0));\n        const auto captureFrame = mArtNetCapture.recorded_frames_fast();\n        const auto showEvent = aeyla::runtime::make_show_midi_event(\n            showMatch.command, showMatch.song_index, channel, midiNote,\n            completed, transportCompleted, offset, captureFrame);\n        (void)mShowMidiIngress.try_submit(showEvent);\n      }\n      return;\n    }\n\n  }\n}\n\nbool ValidateSongLaunchLayout(\n    const aeyla::runtime::ShowMidiMapping& mapping,\n    const std::array<std::uint8_t, aeyla::runtime::kShowMidiSongCapacity>& notes,\n    std::string& error) {\n  if(mapping.channel < 1U || mapping.channel > 16U) {\n    error = "Canal MIDI fuera de rango";\n    return false;\n  }\n  std::set<std::uint8_t> used{\n      mapping.previous_note, mapping.next_note, mapping.play_note,\n      mapping.pause_note, mapping.stop_note, mapping.capture_start_note,\n      mapping.capture_stop_note, aeyla::runtime::kShowMidiPanicNote};\n  for(std::size_t index = 0U; index < notes.size(); ++index) {\n    if(notes[index] > 127U) {\n      error = "Nota de canción fuera de rango";\n      return false;\n    }\n    if(!used.insert(notes[index]).second) {\n      error = "La nota " + std::to_string(notes[index]) +\n              " ya está ocupada por otro control o canción";\n      return false;\n    }\n  }\n  return true;\n}\n\n\nint main(){\n PluginComponentState state;\n state.song_launch_notes[0]=72;state.song_launch_notes[1]=25;state.song_launch_notes[2]=90;\n auto encoded=encode_plugin_component_state(state);assert(encoded.ok());\n auto decoded=decode_plugin_component_state(encoded.bytes);assert(decoded.ok());assert(decoded.state==state);\n std::cout<<"PASS arbitrary per-song state roundtrip 72/25/90\\n";\n auto duplicate=state;duplicate.song_launch_notes[1]=72;assert(!encode_plugin_component_state(duplicate).ok());\n duplicate=state;duplicate.song_launch_notes[1]=41;assert(!encode_plugin_component_state(duplicate).ok());\n encoded.bytes.pop_back();assert(!decode_plugin_component_state(encoded.bytes).ok());\n std::cout<<"PASS duplicate/PANIC/truncation rejection\\n";\n std::string error;assert(ValidateSongLaunchLayout(state.show_midi,state.song_launch_notes,error));\n auto notes=state.song_launch_notes;notes[1]=72;assert(!ValidateSongLaunchLayout(state.show_midi,notes,error));\n std::cout<<"PASS actual Learn layout validation\\n";\n AeylaVisualDmx plug;plug.mShowMidiLaunchNotes[0]=72;plug.mShowMidiLaunchNotes[1]=25;\n plug.ProcessMidiMsg({9,48,127,15});assert(plug.mShowMidiIngress.count==0);\n plug.ProcessMidiMsg({8,72,127,15});assert(plug.mShowMidiIngress.count==0);\n plug.ProcessMidiMsg({9,72,0,15});assert(plug.mShowMidiIngress.count==0);\n plug.ProcessMidiMsg({9,72,127,14});assert(plug.mShowMidiIngress.count==0);\n std::cout<<"PASS old note/NOTE OFF/zero velocity/wrong channel ignored by song queue\\n";\n plug.mShowMidiLearnTarget=ShowMidiLearnTarget::launch_song_base;\n plug.ProcessMidiMsg({8,72,127,15});assert(plug.mShowMidiLearnTarget!=ShowMidiLearnTarget::none);\n plug.ProcessMidiMsg({9,72,127,15});assert(plug.mShowMidiIngress.count==0);assert(plug.mPendingMidiLearnPacked!=0);\n std::cout<<"PASS Learn NOTE ON capture consumed without launch; NOTE OFF does not consume Learn\\n";\n plug.ProcessMidiMsg({9,72,127,15});assert(plug.mShowMidiIngress.count==1);assert(plug.mShowMidiIngress.last.song_index==0);\n plug.ProcessMidiMsg({9,25,127,15});assert(plug.mShowMidiIngress.count==2);assert(plug.mShowMidiIngress.last.song_index==1);\n plug.ProcessMidiMsg({9,25,127,15});assert(plug.mShowMidiIngress.count==3);assert(plug.mShowMidiIngress.last.song_index==1);\n std::cout<<"PASS A->B and B->B generate distinct launch events (not playback validation)\\n";\n}\n', encoding="utf-8")
          Path("tests/test_project_package.cpp").write_text('#include "project/project_package.h"\n#include "show/show_program_codec.h"\n#include "runtime/plugin_state.h"\n\n#include "miniz.h"\n\n#include <cstdlib>\n#include <cstring>\n#include <filesystem>\n#include <fstream>\n#include <iostream>\n#include <set>\n#include <string>\n#include <vector>\n\nnamespace {\nint failures = 0;\n\nvoid check(bool condition, const std::string& message) {\n  if (!condition) {\n    ++failures;\n    std::cerr << "FAIL: " << message << \'\\n\';\n  }\n}\n\nstd::filesystem::path unique_test_directory() {\n  const auto base = std::filesystem::temp_directory_path();\n  for (int attempt = 0; attempt < 100; ++attempt) {\n    const auto candidate = base / ("aeyla-package-test-" + std::to_string(attempt));\n    std::error_code error;\n    if (std::filesystem::create_directory(candidate, error)) return candidate;\n  }\n  return {};\n}\n\nstd::vector<std::uint8_t> read_all(const std::filesystem::path& path) {\n  std::ifstream input(path, std::ios::binary);\n  return {std::istreambuf_iterator<char>(input),\n          std::istreambuf_iterator<char>()};\n}\n\nbool write_raw_zip(const std::filesystem::path& path,\n                   const std::vector<std::pair<std::string, std::string>>& entries) {\n  mz_zip_archive archive{};\n  mz_zip_zero_struct(&archive);\n  if (!mz_zip_writer_init_heap(&archive, 0U, 4096U)) return false;\n\n  for (const auto& [name, contents] : entries) {\n    if (!mz_zip_writer_add_mem(&archive, name.c_str(), contents.data(),\n                               contents.size(), MZ_BEST_COMPRESSION)) {\n      (void) mz_zip_writer_end(&archive);\n      return false;\n    }\n  }\n\n  void* heap = nullptr;\n  std::size_t heap_size = 0U;\n  if (!mz_zip_writer_finalize_heap_archive(&archive, &heap, &heap_size)) {\n    (void) mz_zip_writer_end(&archive);\n    return false;\n  }\n  (void) mz_zip_writer_end(&archive);\n\n  std::ofstream output(path, std::ios::binary | std::ios::trunc);\n  output.write(static_cast<const char*>(heap),\n               static_cast<std::streamsize>(heap_size));\n  mz_free(heap);\n  return static_cast<bool>(output);\n}\n\naeyla::show::ShowProgram make_show(const aeyla::project::ProjectDocument& document,\n                                    std::string song_name = "Package Song") {\n  using namespace aeyla::show;\n  ShowProgram program;\n  SongProgram song;\n  song.song_id = "package-song";\n  song.name = std::move(song_name);\n  song.length_ticks = 4U * song.ppq;\n  song.scenes.push_back({"scene-main", "Main", document.looks.front().look_id,\n                         250U, 250U, false, CueBehavior::latch});\n  song.clips.push_back({"clip-main", "scene-main", 0U, song.length_ticks,\n                        36U, 127U, 1U});\n  song.scenes.front().midi_binding = MidiBinding{36U, 1U};\n  program.songs.push_back(std::move(song));\n  return program;\n}\n\naeyla::project::LiveMemoryPersistentState make_live_state() {\n  using namespace aeyla::project;\n  LiveMemoryPersistentState state;\n\n  auto& front = state.memories[0];\n  front.configured = true;\n  front.mode = PersistentLiveMemoryMode::toggle;\n  front.fade_ms = 1000U;\n  front.midi_kind = PersistentMidiBindingKind::note;\n  front.midi_channel = 3U;\n  front.midi_number = 64U;\n  front.channels = {{1U, 200U}, {3U, 100U}};\n\n  auto& haze = state.memories[1];\n  haze.configured = true;\n  haze.mode = PersistentLiveMemoryMode::fader;\n  haze.fade_ms = 1500U;\n  haze.midi_kind = PersistentMidiBindingKind::control_change;\n  haze.midi_channel = 2U;\n  haze.midi_number = 74U;\n  haze.channels = {{2U, 180U}};\n\n  state.memories[2].mode = PersistentLiveMemoryMode::toggle;\n  state.memories[2].fade_ms = 100U;\n  state.memories[3].mode = PersistentLiveMemoryMode::toggle;\n  state.memories[3].fade_ms = 1000U;\n  return state;\n}\n\nstd::set<std::string> look_ids(const aeyla::project::ProjectDocument& document) {\n  std::set<std::string> result;\n  for (const auto& look : document.looks) result.insert(look.look_id);\n  return result;\n}\n\nstd::string binary_string(const std::vector<std::uint8_t>& bytes) {\n  return std::string(reinterpret_cast<const char*>(bytes.data()), bytes.size());\n}\n}  // namespace\n\nint main() {\n  using namespace aeyla::project;\n\n  const std::filesystem::path directory = unique_test_directory();\n  check(!directory.empty(), "test must create an isolated temporary directory");\n  if (directory.empty()) return EXIT_FAILURE;\n\n  auto document = make_default_project_document(\n      "abcdef12-3456-4789-8abc-def012345678", "2026-08-07T03:00:00Z");\n  document.name = "AEYLA Package Round Trip";\n  const auto show_program = make_show(document);\n  const auto live_state = make_live_state();\n  aeyla::runtime::PluginComponentState midi_state;\n  midi_state.song_launch_notes[0] = 72U;\n  midi_state.song_launch_notes[1] = 25U;\n  midi_state.song_launch_notes[2] = 90U;\n  const auto encoded_midi = aeyla::runtime::encode_plugin_component_state(midi_state);\n  check(encoded_midi.ok(), "arbitrary per-song MIDI state must encode");\n  const auto portable_session = encoded_midi.bytes;\n\n  const auto target = directory / "show.aeylashow";\n  const ProjectPackageSaveResult first =\n      save_project_package_atomic(target, document, show_program, live_state,\n                                  portable_session);\n  check(first.ok(), "first project+show+live+session .aeylashow package save must succeed");\n  check(std::filesystem::exists(target), "package target must exist after save");\n  check(!std::filesystem::exists(target.string() + ".tmp"),\n        "successful package save must not leave a temporary file");\n\n  const ProjectPackageLoadResult loaded = load_project_package(target);\n  check(loaded.ok(), "saved project+show+live .aeylashow package must load");\n  check(!loaded.legacy_project_only && !loaded.legacy_without_live_memory &&\n            !loaded.legacy_without_portable_session,\n        "current four-entry package must not be marked as legacy");\n  if (loaded.document.has_value())\n    check(*loaded.document == document,\n          "package round-trip must preserve the authored project document");\n  if (loaded.show_program.has_value())\n    check(*loaded.show_program == show_program,\n          "package round-trip must preserve songs, scenes, clips and MIDI mappings");\n  check(loaded.live_memory_state == live_state,\n        "package round-trip must preserve sparse live-memory configuration");\n  check(loaded.portable_session_state == portable_session,\n        "package round-trip must preserve bounded portable session bytes exactly");\n  const auto restored_midi = aeyla::runtime::decode_plugin_component_state(loaded.portable_session_state);\n  check(restored_midi.ok() && restored_midi.state == midi_state,\n        "disk .aeylashow session.bin must restore arbitrary song notes 72/25/90");\n\n  const auto second_target = directory / "show-copy.aeylashow";\n  const ProjectPackageSaveResult deterministic =\n      save_project_package_atomic(second_target, document, show_program, live_state,\n                                  portable_session);\n  check(deterministic.ok(), "second independent package save must succeed");\n  check(read_all(target) == read_all(second_target),\n        "identical project+show+live state must produce byte-identical packages");\n\n  auto replacement = document;\n  replacement.name = "AEYLA Package Replacement";\n  replacement.modified_at = "2026-08-07T03:10:00Z";\n  const auto replacement_show = make_show(replacement, "Replacement Song");\n  auto replacement_live = live_state;\n  replacement_live.memories[0].midi_number = 65U;\n  replacement_live.memories[0].channels[0].value = 220U;\n  const ProjectPackageSaveResult replaced =\n      save_project_package_atomic(target, replacement, replacement_show,\n                                  replacement_live, portable_session);\n  check(replaced.ok(), "atomic project+show+live package replacement must succeed");\n  check(std::filesystem::exists(replaced.backup),\n        "replacement must preserve the previous package as backup");\n  const auto current = load_project_package(target);\n  const auto backup = load_project_package(replaced.backup);\n  check(current.ok() && current.document.has_value() &&\n            current.show_program.has_value() &&\n            current.document->name == replacement.name &&\n            current.show_program->songs.front().name == "Replacement Song" &&\n            current.live_memory_state == replacement_live &&\n            current.portable_session_state == portable_session,\n        "target must contain replacement project, show, live and session state together");\n  // Backup has .bak appended, so public loader intentionally rejects it by\n  // extension. Rename a copy to prove the backup bytes remain a valid package.\n  const auto backup_copy = directory / "backup-copy.aeylashow";\n  std::filesystem::copy_file(replaced.backup, backup_copy,\n                             std::filesystem::copy_options::overwrite_existing);\n  const auto backup_loaded = load_project_package(backup_copy);\n  check(!backup.ok() && backup_loaded.ok() && backup_loaded.document.has_value() &&\n            backup_loaded.show_program.has_value() &&\n            backup_loaded.document->name == document.name &&\n            *backup_loaded.show_program == show_program &&\n            backup_loaded.live_memory_state == live_state &&\n            backup_loaded.portable_session_state == portable_session,\n        "backup bytes must preserve the previous project+show+live+session transaction");\n\n  const std::string project_json = serialize_project_document(document);\n  const auto encoded_show = aeyla::show::encode_show_program(\n      show_program, look_ids(document));\n  check(encoded_show.ok(), "test fixture show.bin must encode");\n  std::vector<std::string> live_diagnostics;\n  const auto encoded_live = encode_live_memory_persistent_state(\n      live_state, live_diagnostics);\n  check(live_diagnostics.empty() && !encoded_live.empty(),\n        "test fixture live.bin must encode");\n\n  // Previous current-format compatibility: project.json + show.bin remains\n  // readable and receives an empty/OFF live-memory state.\n  const auto previous_current = directory / "previous-current.aeylashow";\n  check(write_raw_zip(previous_current,\n                      {{"project.json", project_json},\n                       {"show.bin", binary_string(encoded_show.bytes)}}),\n        "test must construct a previous two-entry package");\n  const auto previous_loaded = load_project_package(previous_current);\n  check(previous_loaded.ok() && !previous_loaded.legacy_project_only &&\n            previous_loaded.legacy_without_live_memory &&\n            previous_loaded.legacy_without_portable_session &&\n            previous_loaded.show_program.has_value() &&\n            *previous_loaded.show_program == show_program &&\n            previous_loaded.live_memory_state == LiveMemoryPersistentState{},\n        "two-entry project+show package must migrate with live memories empty/OFF");\n\n  // Legacy Alpha package compatibility: project.json only becomes a valid\n  // empty authoring show and empty/OFF live-memory state.\n  const auto legacy = directory / "legacy-project-only.aeylashow";\n  check(write_raw_zip(legacy, {{"project.json", project_json}}),\n        "test must construct a legacy project-only archive");\n  const auto legacy_loaded = load_project_package(legacy);\n  check(legacy_loaded.ok() && legacy_loaded.legacy_project_only &&\n            legacy_loaded.legacy_without_live_memory &&\n            legacy_loaded.legacy_without_portable_session &&\n            legacy_loaded.show_program.has_value() &&\n            legacy_loaded.show_program->songs.empty() &&\n            legacy_loaded.live_memory_state == LiveMemoryPersistentState{},\n        "legacy project-only package must migrate to empty show + empty live state");\n  check(!aeyla::show::validate_show_program_for_performance(\n             *legacy_loaded.show_program, look_ids(document)).ok(),\n        "legacy empty show must not accidentally pass performance preflight");\n\n  // Compatibility save overloads write R10.1 current format, including an\n  // explicit empty live.bin rather than leaving the package legacy.\n  const auto empty_current = directory / "empty-current.aeylashow";\n  check(save_project_package_atomic(empty_current, document).ok(),\n        "project-only save API must write a valid current empty-show package");\n  const auto empty_current_loaded = load_project_package(empty_current);\n  check(empty_current_loaded.ok() && !empty_current_loaded.legacy_project_only &&\n            !empty_current_loaded.legacy_without_live_memory &&\n            empty_current_loaded.legacy_without_portable_session &&\n            empty_current_loaded.show_program.has_value() &&\n            empty_current_loaded.show_program->songs.empty() &&\n            empty_current_loaded.live_memory_state == LiveMemoryPersistentState{},\n        "compatibility save overload must emit project.json + show.bin + live.bin");\n\n  const auto wrong_extension = directory / "show.zip";\n  check(!save_project_package_atomic(wrong_extension, document, show_program,\n                                     live_state).ok(),\n        "save must reject a non-.aeylashow extension");\n\n  const std::vector<std::uint8_t> oversized_session(64U * 1024U + 1U, 0x5aU);\n  check(!save_project_package_atomic(directory / "oversized-session.aeylashow",\n                                     document, show_program, live_state,\n                                     oversized_session).ok(),\n        "save must reject portable session state beyond 64 KiB");\n\n  auto with_asset = document;\n  with_asset.assets.push_back({"assets/intro.mov", std::string(64U, \'a\')});\n  check(!save_project_package_atomic(directory / "assets.aeylashow",\n                                     with_asset, show_program, live_state).ok(),\n        "asset-bearing package must remain blocked until SHA verification exists");\n\n  auto invalid_show = show_program;\n  invalid_show.songs.front().scenes.front().look_id = "missing-look";\n  check(!save_project_package_atomic(directory / "invalid-show.aeylashow",\n                                     document, invalid_show, live_state).ok(),\n        "package save must reject a show referencing a missing project look");\n\n  auto invalid_live = live_state;\n  invalid_live.memories[0].channels.push_back({3U, 9U});\n  check(!save_project_package_atomic(directory / "invalid-live.aeylashow",\n                                     document, show_program, invalid_live).ok(),\n        "package save must reject invalid live-memory state transactionally");\n\n  const auto extra_entry = directory / "extra-entry.aeylashow";\n  check(write_raw_zip(extra_entry,\n                      {{"project.json", project_json},\n                       {"show.bin", binary_string(encoded_show.bytes)},\n                       {"live.bin", binary_string(encoded_live)},\n                       {"assets/extra.bin", "x"}}),\n        "test must construct an archive with an unexpected fourth entry");\n  check(!load_project_package(extra_entry).ok(),\n        "loader must reject unexpected archive entries");\n\n  const auto live_without_show = directory / "live-without-show.aeylashow";\n  check(write_raw_zip(live_without_show,\n                      {{"project.json", project_json},\n                       {"live.bin", binary_string(encoded_live)}}),\n        "test must construct an invalid project+live package");\n  check(!load_project_package(live_without_show).ok(),\n        "loader must reject live.bin without show.bin");\n\n  const auto traversal_entry = directory / "traversal.aeylashow";\n  check(write_raw_zip(traversal_entry, {{"../project.json", project_json}}),\n        "test must construct a traversal archive");\n  check(!load_project_package(traversal_entry).ok(),\n        "loader must reject traversal or non-root project entries");\n\n  const auto duplicate_entry = directory / "duplicate.aeylashow";\n  check(write_raw_zip(duplicate_entry,\n                      {{"project.json", project_json},\n                       {"project.json", project_json}}),\n        "test must construct duplicate project entries");\n  check(!load_project_package(duplicate_entry).ok(),\n        "loader must reject duplicate project.json entries");\n\n  const auto corrupt_show = directory / "corrupt-show.aeylashow";\n  check(write_raw_zip(corrupt_show,\n                      {{"project.json", project_json},\n                       {"show.bin", "not-a-valid-show"}}),\n        "test must construct a package with corrupt show.bin");\n  const auto corrupt_show_loaded = load_project_package(corrupt_show);\n  check(!corrupt_show_loaded.ok() && !corrupt_show_loaded.document.has_value(),\n        "corrupt show.bin must fail the transaction before project publication");\n\n  auto corrupt_live_bytes = encoded_live;\n  corrupt_live_bytes[0] = \'X\';\n  const auto corrupt_live = directory / "corrupt-live.aeylashow";\n  check(write_raw_zip(corrupt_live,\n                      {{"project.json", project_json},\n                       {"show.bin", binary_string(encoded_show.bytes)},\n                       {"live.bin", binary_string(corrupt_live_bytes)}}),\n        "test must construct a package with corrupt live.bin");\n  const auto corrupt_live_loaded = load_project_package(corrupt_live);\n  check(!corrupt_live_loaded.ok() && !corrupt_live_loaded.document.has_value(),\n        "corrupt live.bin must fail the transaction before project publication");\n\n  const auto corrupt = directory / "corrupt.aeylashow";\n  {\n    std::ofstream output(corrupt, std::ios::binary | std::ios::trunc);\n    output << "not-a-zip";\n  }\n  check(!load_project_package(corrupt).ok(),\n        "loader must reject corrupted package bytes");\n\n  std::error_code cleanup_error