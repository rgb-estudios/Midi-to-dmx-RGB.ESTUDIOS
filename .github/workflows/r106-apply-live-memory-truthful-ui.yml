name: r106-apply-live-memory-truthful-ui

on:
  push:
    branches:
      - rgb/r10.6-pro-ui-stabilization-20260830
    paths:
      - .github/workflows/r106-apply-live-memory-truthful-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.6-pro-ui-stabilization-20260830
          fetch-depth: 0

      - name: Apply EN VIVO truthful-state polish
        run: python3 .github/scripts/r106_apply_live_memory_truthful_ui.py

      - name: Verify patch
        run: |
          git diff --check
          grep -q 'DMX · PASO 2/2' product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          grep -q 'FADE → ON' product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          grep -q 'TOCA PARA CONFIGURAR' product/AeylaVisualDmx/AeylaRuntimeStatusControl.h

      - name: Commit result and remove applicator
        run: |
          git config user.name 'rgb-estudios-r10.6-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/r106-apply-live-memory-truthful-ui.yml
          git rm .github/scripts/r106_apply_live_memory_truthful_ui.py
          git add product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          git commit -m 'ui(r10.6): make EN VIVO memory states truthful'
          git push origin HEAD:rgb/r10.6-pro-ui-stabilization-20260830
