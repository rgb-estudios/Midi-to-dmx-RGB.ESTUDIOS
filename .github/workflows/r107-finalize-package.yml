name: r107-finalize-package

on:
  push:
    branches:
      - rgb/r10.7-renamable-live-memories-ui-20260831
    paths:
      - tools/r107_finalize_package.py
      - .github/workflows/r107-finalize-package.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.7-renamable-live-memories-ui-20260831
          fetch-depth: 0
          persist-credentials: true
      - name: Apply package identity
        run: |
          python3 tools/r107_finalize_package.py
          git diff --check
      - name: Publish and remove one-shot tooling
        run: |
          git config user.name "rgb-estudios-r10.7-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/reaper-windows-pretest-package.yml
          git rm tools/r107_finalize_package.py \
                 .github/workflows/r107-finalize-package.yml
          git diff --cached --check
          git commit -m "chore(r10.7): identify Windows PRETEST package"
          git push origin HEAD:rgb/r10.7-renamable-live-memories-ui-20260831
