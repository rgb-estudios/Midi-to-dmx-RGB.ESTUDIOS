name: alpha03-windows-startup-smoke

on:
  pull_request:
    paths:
      - product/**
      - src/core/**
      - src/product/**
      - src/runtime/**
      - .github/workflows/alpha03-native-window.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0

jobs:
  windows-startup-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned iPlug2 and VST3 SDK
        shell: pwsh
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout $env:IPLUG2_COMMIT

          $sdkPath = "external/iPlug2/Dependencies/IPlug/VST3_SDK"
          if (Test-Path $sdkPath) { Remove-Item -Recurse -Force $sdkPath }
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git $sdkPath
          git -C $sdkPath checkout $env:VST3SDK_COMMIT
          git -C $sdkPath submodule update --init --recursive

          if (-not (Test-Path "$sdkPath/pluginterfaces")) {
            throw "Pinned Steinberg VST3 SDK is missing"
          }

      - name: Verify Windows application resources
        shell: pwsh
        run: |
          $resource = "product/AeylaVisualDmx/resources/main.rc"
          if (-not (Test-Path $resource)) {
            throw "Windows resource script is missing"
          }
          $text = Get-Content $resource -Raw
          foreach ($required in @("IDD_DIALOG_MAIN", "IDR_MENU1", "IDR_ACCELERATOR1")) {
            if ($text -notmatch $required) {
              throw "Windows resource script is missing $required"
            }
          }

      - name: Configure source-built graphical product
        shell: pwsh
        run: >-
          cmake -S product -B build-native-window
          -DIPLUG2_DIR="${{ github.workspace }}/external/iPlug2"
          -DIPLUG_DEPLOY_PLUGINS=OFF
          -DIGRAPHICS_BACKEND=NANOVG

      - name: Build source Windows standalone
        run: cmake --build build-native-window --config Release --target AeylaVisualDmx-app

      - name: Headless Windows startup smoke
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path build-native-window -Recurse -File -Filter "AeylaVisualDmx.exe" | Select-Object -First 1
          if (-not $app) { throw "Source-built graphical standalone was not produced" }

          $evidenceDir = Join-Path (Resolve-Path build-native-window) "evidence"
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          $evidence = Join-Path $evidenceDir "WINDOW_STARTUP_SMOKE.txt"
          $eventEvidence = Join-Path $evidenceDir "WINDOW_CRASH_EVENTS.txt"

          # Capture a real crash dump and Application Error/WER metadata if the
          # source-built standalone exits unexpectedly. This keeps the gate
          # strict while turning 0xC0000005 from an opaque red check into an
          # actionable faulting-module/offset report.
          $dumpKey = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\AeylaVisualDmx.exe"
          New-Item -Path $dumpKey -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpFolder -Value $evidenceDir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null

          # GitHub-hosted Windows runners do not provide a reliable interactive
          # desktop contract. MainWindowHandle/screenshot assertions therefore
          # produced false negatives even when the APP and VST3 built correctly.
          # CI validates process startup/crash behaviour here. A real visible
          # window remains a mandatory manual gate on an interactive Windows host.
          $startedAt = Get-Date
          $process = Start-Process -FilePath $app.FullName -ArgumentList "--no-io" -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited) {
            Start-Sleep -Seconds 2
            $events = Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              StartTime = $startedAt.AddSeconds(-2)
            } -ErrorAction SilentlyContinue | Where-Object {
              $_.ProviderName -in @('Application Error', 'Windows Error Reporting') -and
              $_.Message -match 'AeylaVisualDmx'
            } | Select-Object -First 12 TimeCreated, Id, ProviderName, LevelDisplayName, Message

            if ($events) {
              $events | Format-List | Out-String -Width 4096 | Set-Content -Encoding UTF8 $eventEvidence
            } else {
              "No matching Application Error / Windows Error Reporting event was available." |
                Set-Content -Encoding UTF8 $eventEvidence
            }

            $dumps = @(Get-ChildItem -Path $evidenceDir -File -Filter "*.dmp" -ErrorAction SilentlyContinue)
            @(
              "RESULT: FAILED - standalone exited during headless startup smoke"
              "ExitCode: $($process.ExitCode)"
              ("ExitCodeHex: 0x{0:X8}" -f ([uint32]$process.ExitCode))
              "Commit: $env:GITHUB_SHA"
              "Executable: $($app.FullName)"
              "CrashDumps: $($dumps.Count)"
              "EventEvidence: $eventEvidence"
            ) | Set-Content -Encoding UTF8 $evidence
            Get-Content $evidence
            Get-Content $eventEvidence
            throw "Source-built graphical APP exited with code $($process.ExitCode)"
          }

          @(
            "RESULT: PASS - standalone remained alive during headless startup smoke"
            "PID: $($process.Id)"
            "Commit: $env:GITHUB_SHA"
            "Executable: $($app.FullName)"
            "OS: $([Environment]::OSVersion.VersionString)"
            "MANUAL_GATE_REQUIRED: open the APP/VST3 on an interactive Windows desktop and verify native UI input."
          ) | Set-Content -Encoding UTF8 $evidence
          Get-Content $evidence
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - name: Collect validated source build
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/Standalone | Out-Null
          New-Item -ItemType Directory -Force package/Evidence | Out-Null

          $app = Get-ChildItem -Path build-native-window -Recurse -File -Filter "AeylaVisualDmx.exe" | Select-Object -First 1
          if ($app) { Copy-Item -Force $app.FullName package/Standalone/ }

          $pdb = Get-ChildItem -Path build-native-window -Recurse -File -Filter "AeylaVisualDmx.pdb" | Select-Object -First 1
          if ($pdb) { Copy-Item -Force $pdb.FullName package/Evidence/ }

          if (Test-Path build-native-window/evidence) {
            Copy-Item -Force build-native-window/evidence/* package/Evidence/ -ErrorAction SilentlyContinue
          }

          @'
          AEYLA Windows CI startup evidence

          This artifact proves that the source-built standalone starts and remains
          alive on the GitHub-hosted Windows runner. If it crashes, the evidence
          folder also contains Windows Error Reporting/Application Error metadata
          and, when Windows produces it, a full user-mode crash dump.

          Mandatory release gate: open AEYLA in REAPER/Windows on real hardware,
          interact with the UI, arm Art-Net and validate an external receiver.
          '@ | Set-Content -Encoding UTF8 package/Evidence/MANUAL_WINDOW_GATE.txt

          if (Test-Path package/Standalone/AeylaVisualDmx.exe) {
            $hash = (Get-FileHash package/Standalone/AeylaVisualDmx.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  Standalone/AeylaVisualDmx.exe" | Set-Content -Encoding ASCII package/SHA256SUMS.txt
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEYLA-R08-Windows-source-startup-smoke
          path: package/**
          if-no-files-found: error
