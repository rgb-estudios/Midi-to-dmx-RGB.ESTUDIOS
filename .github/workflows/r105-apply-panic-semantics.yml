name: r105-apply-panic-semantics

on:
  push:
    branches:
      - rgb/r10.5-blackout-ui-contract-20260830
    paths:
      - patches/r105_panic_semantics.py
      - .github/workflows/r105-apply-panic-semantics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.5-blackout-ui-contract-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Apply PANIC semantics
        shell: bash
        run: |
          python patches/r105_panic_semantics.py
          git diff --check
          git config user.name "rgb-estudios-r10.5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product/AeylaVisualDmx/AeylaMidiShowIntegration.cpp
          git rm patches/r105_panic_semantics.py .github/workflows/r105-apply-panic-semantics.yml
          git diff --cached --quiet && { echo "No PANIC changes produced"; exit 1; }
          git commit -m "fix(r10.5): unify MIDI PANIC with persistent blackout mask"
          git push origin HEAD:rgb/r10.5-blackout-ui-contract-20260830
