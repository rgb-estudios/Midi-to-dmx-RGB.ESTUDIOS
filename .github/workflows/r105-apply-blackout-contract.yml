name: r105-apply-blackout-contract

on:
  push:
    branches:
      - rgb/r10.5-blackout-ui-contract-20260830
    paths:
      - patches/r105_blackout_contract.py
      - .github/workflows/r105-apply-blackout-contract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.5-blackout-ui-contract-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact blackout contract patch
        shell: bash
        run: |
          python patches/r105_blackout_contract.py
          git diff --check
          git config user.name "rgb-estudios-r10.5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/output/artnet_output_worker.h \
                  src/output/artnet_output_worker.cpp \
                  product/AeylaVisualDmx/AeylaShowPlayerIntegration.cpp \
                  product/AeylaVisualDmx/AeylaVisualDmx.cpp \
                  product/AeylaVisualDmx/AeylaVisualDmx.h \
                  tests/test_artnet_output_worker.cpp
          git rm patches/r105_blackout_contract.py .github/workflows/r105-apply-blackout-contract.yml
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "fix(r10.5): make blackout a persistent zero-DMX authority mask"
          git push origin HEAD:rgb/r10.5-blackout-ui-contract-20260830
