name: reaper-windows-pretest-package

on:
  pull_request:
    paths:
      - product/**
      - src/**
      - tests/**
      - docs/AEYLA_UI_INTERACTION_CONTRACT_ES.md
      - docs/AEYLA_R10_FIELD_PRETEST_ES.md
      - docs/R10_4_AUTHORITY_CONTRACT.md
      - docs/R10_5_BLACKOUT_UI_CONTRACT.md
      - tools/maintenance/windows/**
      - tools/network/**
      - .github/workflows/reaper-windows-pretest-package.yml
  workflow_dispatch:

env:
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0

jobs:
  package-windows-reaper-pretest:
    name: Windows / RGB Live Control R10.5 / manual REAPER pretest
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate AEYLA maintenance tools
        shell: pwsh
        run: |
          $script = (Resolve-Path "tools/maintenance/windows/AEYLA_VST3_MAINTENANCE.ps1").Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "AEYLA maintenance PowerShell syntax validation failed"
          }
          & $script -Action Audit

      - name: Fetch pinned plugin dependencies
        shell: pwsh
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout $env:IPLUG2_COMMIT
          $sdk = "external/iPlug2/Dependencies/IPlug/VST3_SDK"
          if (Test-Path $sdk) { Remove-Item -Recurse -Force $sdk }
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git $sdk
          git -C $sdk checkout $env:VST3SDK_COMMIT
          git -C $sdk submodule update --init --recursive

      - name: Build integrated RGB Live Control VST3
        shell: pwsh
        run: |
          cmake -S product -B build-product -DIPLUG2_DIR="${{ github.workspace }}/external/iPlug2" -DIPLUG_DEPLOY_PLUGINS=OFF -DIGRAPHICS_BACKEND=NANOVG
          cmake --build build-product --config Release --target AeylaVisualDmx-vst3

      - name: Verify bundle and PE image
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build-product -Recurse -Directory -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "AeylaVisualDmx.vst3 bundle not found" }
          $binary = Get-ChildItem $bundle.FullName -Recurse -File -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          if (-not $binary) { throw "RGB Live Control VST3 binary not found" }
          $helper = Get-ChildItem $bundle.FullName -Recurse -File -Filter "AeylaNetworkHelper.exe" | Select-Object -First 1
          if (-not $helper) { throw "AeylaNetworkHelper.exe not embedded in VST3 bundle" }
          if ($binary.Length -lt 1MB) { throw "RGB Live Control VST3 binary unexpectedly small" }
          $stream = [System.IO.File]::OpenRead($binary.FullName)
          try { $b0=$stream.ReadByte(); $b1=$stream.ReadByte() } finally { $stream.Dispose() }
          if ($b0 -ne 0x4D -or $b1 -ne 0x5A) { throw "RGB Live Control VST3 binary lacks PE/MZ header" }
          $helperStream = [System.IO.File]::OpenRead($helper.FullName)
          try { $h0=$helperStream.ReadByte(); $h1=$helperStream.ReadByte() } finally { $helperStream.Dispose() }
          if ($h0 -ne 0x4D -or $h1 -ne 0x5A) { throw "AeylaNetworkHelper.exe lacks PE/MZ header" }
          Write-Host "Verified bundle $($bundle.FullName) binarySize=$($binary.Length) helperSize=$($helper.Length)"

      - name: Package manual REAPER pretest
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build-product -Recurse -Directory -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          $root = Join-Path $PWD "reaper-pretest"
          $vst3Root = Join-Path $root "VST3"
          New-Item -ItemType Directory -Force $vst3Root | Out-Null
          Copy-Item -Recurse -Force $bundle.FullName (Join-Path $vst3Root "AeylaVisualDmx.vst3")

          Copy-Item tools/maintenance/windows/AEYLA_VST3_MAINTENANCE.ps1 $root
          Copy-Item tools/maintenance/windows/AUDIT_AEYLA.cmd $root
          Copy-Item tools/maintenance/windows/CLEAN_AEYLA.cmd $root
          Copy-Item tools/maintenance/windows/INSTALL_AEYLA.cmd $root
          Copy-Item tools/maintenance/windows/CLEAN_INSTALL_AEYLA.cmd $root
          Copy-Item docs/AEYLA_UI_INTERACTION_CONTRACT_ES.md (Join-Path $root "UI_INTERACTION_CONTRACT.md")
          Copy-Item docs/AEYLA_R10_FIELD_PRETEST_ES.md (Join-Path $root "R10_FIELD_PRETEST_ES.md")
          Copy-Item docs/R10_5_BLACKOUT_UI_CONTRACT.md (Join-Path $root "R10_5_BLACKOUT_UI_CONTRACT.md")

          @'
          RGB LIVE CONTROL — RGB ESTUDIOS
          SHOW / AEYLA — R10.5 WINDOWS / REAPER PRETEST

          ESTADO
          PRETEST_NOT_SHOW_CANDIDATE. CI verde no significa Show Ready.

          INSTALACION
          1. Cierra REAPER, Ableton y cualquier host VST3.
          2. Ejecuta CLEAN_INSTALL_AEYLA.cmd.
          3. Abre REAPER y re-scan VST3 si RGB Live Control no aparece automaticamente.
          4. Confirma visualmente R10.5 PRETEST y revisa BUILD_ID.txt.

          AUTORIDAD FISICA R10.5
          - ARMAR obtiene y mantiene autoridad Art-Net.
          - DESARMAR retira autoridad y deja una rafaga corta de seguridad.
          - APAGON TOTAL NO desarma: mantiene ARM/socket/carrier y transmite DMX 0 continuo a ~44 Hz.
          - APAGON TOTAL tiene prioridad sobre Take, HOLD y memorias EN VIVO.
          - Liberar APAGON revela el estado subyacente sin un segundo ARM.
          - Cambio de ventana/pestana/PREPARADA/PREV/NEXT/PLAY/PAUSA/HOLD/STOP no puede retirar ARM.
          - Fallos reales de backend/runtime, render offline, shutdown y cambio fisico TX conservan fail-closed.

          NAVEGACION R10.5
          TOMA | EN VIVO | MIDI | SISTEMA
          - Un solo shell RGB Live Control.
          - ARM y APAGON permanecen en la misma ubicacion en los cuatro workspaces.
          - Cambiar workspace es presentacion unicamente; no modifica autoridad ni transporte.
          - ARCHIVO permanece en el footer.

          CAPTURA / MIDI
          - REC START N42 y REC STOP N43 por defecto.
          - MIDI nunca puede ARMAR ni quitar APAGON.
          - PREPARADA no sustituye AL AIRE hasta GO/PLAY explicito.
          - A -> B usa reemplazo atomico sin blackout intermedio.

          EN VIVO
          - FRONTAL, HUMO/HAZE, BASE BLANCA y TEST LUMINARIAS.
          - Operacion muestra boton/fader; CONFIGURAR contiene Learn, modo y fade.
          - DMX Learn usa snapshots OFF -> ON y mascara sparse de slots cambiados.

          GATE FISICO OBLIGATORIO
          1. ARM una vez con DMX no-cero.
          2. Activa APAGON TOTAL: receptor sigue ~44 Hz, todos los slots 0 y ARM sigue activo.
          3. Libera APAGON: vuelve el estado subyacente sin rearmar.
          4. Cambia TOMA/EN VIVO/MIDI/SISTEMA al menos 10 veces: sin caida de carrier ni blackout accidental.
          5. A AL AIRE -> B PREPARADA -> GO: B entra sin corte.
          6. DESARMAR: la autoridad termina.
          7. Re-ARM y APAGON/PANIC: cero DMX debe imponerse inmediatamente.

          Lee R10_5_BLACKOUT_UI_CONTRACT.md y R10_FIELD_PRETEST_ES.md.
          '@ | Set-Content -Encoding UTF8 (Join-Path $root "LEEME_PRIMERO_REAPER.txt")

          $binary = Get-ChildItem (Join-Path $vst3Root "AeylaVisualDmx.vst3") -Recurse -File -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          $helper = Get-ChildItem (Join-Path $vst3Root "AeylaVisualDmx.vst3") -Recurse -File -Filter "AeylaNetworkHelper.exe" | Select-Object -First 1
          if (-not $binary -or -not $helper) { throw "Critical binary missing from package" }

          $hash = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $helperHash = (Get-FileHash $helper.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceCommit = (git rev-parse HEAD).Trim()
          "VST3_BINARY_SHA256=$hash" | Set-Content -Encoding ASCII (Join-Path $root "BUILD_ID.txt")
          "NETWORK_HELPER_SHA256=$helperHash" | Add-Content -Encoding ASCII (Join-Path $root "BUILD_ID.txt")
          "SOURCE_COMMIT=$sourceCommit" | Add-Content -Encoding ASCII (Join-Path $root "BUILD_ID.txt")
          "BUILD_KIND=RGB_LIVE_CONTROL_R10_5_REAPER_WINDOWS_PRETEST" | Add-Content -Encoding ASCII (Join-Path $root "BUILD_ID.txt")
          "HOST_STATE_SCHEMA=1.4" | Add-Content -Encoding ASCII (Join-Path $root "BUILD_ID.txt")
          "STATUS=PRETEST_NOT_SHOW_CANDIDATE" | Add-Content -Encoding ASCII (Join-Path $root "BUILD_ID.txt")

          $binaryRel = [System.IO.Path]::GetRelativePath($root, $binary.FullName).Replace('\','/')
          $helperRel = [System.IO.Path]::GetRelativePath($root, $helper.FullName).Replace('\','/')
          @(
            "$hash  $binaryRel",
            "$helperHash  $helperRel"
          ) | Set-Content -Encoding ASCII (Join-Path $root "SHA256SUMS.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: RGB-Live-Control-R10.5-REAPER-Windows-PRETEST
          path: reaper-pretest/**
          if-no-files-found: error
          retention-days: 90
