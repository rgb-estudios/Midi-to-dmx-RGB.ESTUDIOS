name: r106-apply-pro-ui-stabilization

on:
  push:
    branches:
      - rgb/r10.6-pro-ui-stabilization-20260830
    paths:
      - patches/r106_pro_ui_stabilization.py
      - .github/workflows/r106-apply-pro-ui-stabilization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.6-pro-ui-stabilization-20260830
          fetch-depth: 0
          persist-credentials: true
      - name: Apply R10.6 UI stabilization
        run: |
          python patches/r106_pro_ui_stabilization.py
          git diff --check
          git config user.name "rgb-estudios-r10.6-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product/AeylaVisualDmx/AeylaMainControl.h
          git add product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          git rm patches/r106_pro_ui_stabilization.py
          git rm .github/workflows/r106-apply-pro-ui-stabilization.yml
          git diff --cached --quiet && { echo "No R10.6 changes produced"; exit 1; }
          git commit -m "feat(r10.6): professionalize live control interaction hierarchy"
          git push origin HEAD:rgb/r10.6-pro-ui-stabilization-20260830
