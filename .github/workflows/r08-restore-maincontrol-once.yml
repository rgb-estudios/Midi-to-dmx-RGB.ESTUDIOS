name: r08-restore-maincontrol-once

on:
  push:
    branches:
      - aeyla/r08-capture-zero-midi-rec-20260829
    paths:
      - .github/workflows/r08-restore-maincontrol-once.yml

permissions:
  contents: write

jobs:
  restore-validated-maincontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact validated R08.2 MainControl and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat product/AeylaVisualDmx/AeylaMainControl.h)" = "PLACEHOLDER"
          git cat-file -e 03a52f4b4bc727f83106dc57bf603d4852e6a8ea^{commit}
          git show 03a52f4b4bc727f83106dc57bf603d4852e6a8ea:product/AeylaVisualDmx/AeylaMainControl.h > product/AeylaVisualDmx/AeylaMainControl.h
          git rm .github/workflows/r08-restore-maincontrol-once.yml
          git diff --check
          git diff --exit-code 03a52f4b4bc727f83106dc57bf603d4852e6a8ea -- product/AeylaVisualDmx/AeylaMainControl.h
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product/AeylaVisualDmx/AeylaMainControl.h
          git commit -m "Restore validated R08.2 MainControl"
          git push origin HEAD:aeyla/r08-capture-zero-midi-rec-20260829
