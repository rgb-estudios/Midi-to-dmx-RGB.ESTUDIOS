name: graphical-app-and-vst3

on:
  push:
    branches:
      - agent/shared-graphics-ui
  pull_request:
    paths:
      - product/**
      - src/runtime/**
      - .github/workflows/graphical-product.yml
  workflow_dispatch:

env:
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0

jobs:
  windows-graphical:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned graphical framework and VST3 SDK
        shell: pwsh
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout $env:IPLUG2_COMMIT

          $sdkPath = "external/iPlug2/Dependencies/IPlug/VST3_SDK"
          if (Test-Path $sdkPath) { Remove-Item -Recurse -Force $sdkPath }
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git $sdkPath
          git -C $sdkPath checkout $env:VST3SDK_COMMIT
          git -C $sdkPath submodule update --init --recursive

          if (-not (Test-Path "$sdkPath/pluginterfaces")) {
            throw "Pinned Steinberg VST3 SDK is missing"
          }

      - name: Configure graphical product
        shell: pwsh
        run: >-
          cmake -S product -B build-graphical
          -DIPLUG2_DIR="${{ github.workspace }}/external/iPlug2"
          -DIPLUG_DEPLOY_PLUGINS=OFF
          -DIGRAPHICS_BACKEND=NANOVG

      - name: Build Windows APP and VST3
        run: cmake --build build-graphical --config Release --target AeylaVisualDmx-app AeylaVisualDmx-vst3

      - name: Collect Windows graphical package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/Standalone | Out-Null
          New-Item -ItemType Directory -Force package/VST3 | Out-Null

          $app = Get-ChildItem -Path build-graphical -Recurse -File -Filter "AeylaVisualDmx.exe" | Select-Object -First 1
          if (-not $app) { throw "Graphical standalone executable was not produced" }
          Copy-Item -Force $app.FullName package/Standalone/

          $vst3 = Get-ChildItem -Path build-graphical -Recurse -Directory -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "Graphical VST3 bundle was not produced" }
          Copy-Item -Recurse -Force $vst3.FullName package/VST3/

          @'
          @echo off
          cd /d "%~dp0Standalone"
          start "AEYLA Visual DMX" AeylaVisualDmx.exe
          '@ | Set-Content -Encoding ASCII package/ABRIR_AEYLA_VISUAL_DMX.cmd

          @'
          @echo off
          setlocal
          set "SOURCE=%~dp0VST3\AeylaVisualDmx.vst3"
          set "DEST=C:\Program Files\Common Files\VST3\AeylaVisualDmx.vst3"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process powershell -Verb RunAs -Wait -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-Command','Copy-Item -Recurse -Force ''%SOURCE%'' ''%DEST%'''"
          echo VST3 installation command completed.
          pause
          '@ | Set-Content -Encoding ASCII package/INSTALAR_VST3_AEYLA.cmd

          @'
          AEYLA VISUAL DMX 0.2 GRAPHICAL ALPHA

          This package must open as a graphical window, not a terminal.
          Test source buttons, animated canvas, Rig 10/14, fixture selection,
          Grand Master, extraction sliders, executor pads, Output Arm and Blackout.

          The VST3 uses the same graphical surface inside Ableton.
          Honest boundary: Art-Net and USB-DMX are not connected in this build.
          '@ | Set-Content -Encoding UTF8 package/LEEME_PRUEBA_GRAFICA.txt

          Get-ChildItem -Recurse package

      - uses: actions/upload-artifact@v4
        with:
          name: AEYLA-Visual-DMX-0.2-Windows-Graphical-APP-and-VST3
          path: package/**
          if-no-files-found: error

  macos-graphical:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned graphical framework and VST3 SDK
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout "$IPLUG2_COMMIT"

          sdk_path="external/iPlug2/Dependencies/IPlug/VST3_SDK"
          rm -rf "$sdk_path"
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git "$sdk_path"
          git -C "$sdk_path" checkout "$VST3SDK_COMMIT"
          git -C "$sdk_path" submodule update --init --recursive

          test -d "$sdk_path/pluginterfaces"

      - name: Configure graphical universal product
        run: >-
          cmake -S product -B build-graphical -G Xcode
          -DIPLUG2_DIR="${GITHUB_WORKSPACE}/external/iPlug2"
          -DIPLUG2_UNIVERSAL=ON
          -DIPLUG_DEPLOY_PLUGINS=OFF
          -DIGRAPHICS_BACKEND=NANOVG
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build macOS APP and VST3
        shell: bash
        run: |
          set +e
          mkdir -p build-graphical/diagnostics
          cmake --build build-graphical --config Release --target AeylaVisualDmx-app AeylaVisualDmx-vst3 2>&1 | tee build-graphical/diagnostics/macos-build.log
          status=${PIPESTATUS[0]}
          echo "$status" > build-graphical/diagnostics/macos-build-exit-code.txt
          exit "$status"

      - name: Upload macOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEYLA-macOS-graphical-build-diagnostics
          path: build-graphical/diagnostics/**
          if-no-files-found: warn

      - name: Collect macOS graphical package
        run: |
          mkdir -p package/Standalone package/VST3
          app="$(find build-graphical -type d -name 'AeylaVisualDmx.app' | head -n 1)"
          test -n "$app"
          cp -R "$app" package/Standalone/

          vst3="$(find build-graphical -type d -name 'AeylaVisualDmx.vst3' | head -n 1)"
          test -n "$vst3"
          cp -R "$vst3" package/VST3/

          file package/Standalone/AeylaVisualDmx.app/Contents/MacOS/*
          file package/VST3/AeylaVisualDmx.vst3/Contents/MacOS/*

          cat > package/LEEME_PRUEBA_GRAFICA.txt <<'README'
          AEYLA VISUAL DMX 0.2 GRAPHICAL ALPHA

          Open Standalone/AeylaVisualDmx.app. It must display the same graphical
          surface used by the VST3. This unsigned alpha does not transmit DMX.
          README

          mkdir -p artifacts
          tar -czf artifacts/AEYLA-Visual-DMX-0.2-macOS-Graphical-APP-and-VST3.tar.gz -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: AEYLA-Visual-DMX-0.2-macOS-Graphical-APP-and-VST3
          path: artifacts/**
          if-no-files-found: error
