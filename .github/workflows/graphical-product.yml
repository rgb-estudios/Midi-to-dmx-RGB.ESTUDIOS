name: graphical-app-and-vst3

on:
  push:
    branches:
      - agent/shared-graphics-ui
  pull_request:
    paths:
      - product/**
      - src/runtime/**
      - .github/workflows/graphical-product.yml
  workflow_dispatch:

env:
  IPLUG2_COMMIT: 584df5a3306f3a9a62b5ebb803d3fb58134abdcf
  VST3SDK_COMMIT: 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0

jobs:
  windows-graphical:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned graphical framework and VST3 SDK
        shell: pwsh
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout $env:IPLUG2_COMMIT

          $sdkPath = "external/iPlug2/Dependencies/IPlug/VST3_SDK"
          if (Test-Path $sdkPath) { Remove-Item -Recurse -Force $sdkPath }
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git $sdkPath
          git -C $sdkPath checkout $env:VST3SDK_COMMIT
          git -C $sdkPath submodule update --init --recursive

          if (-not (Test-Path "$sdkPath/pluginterfaces")) {
            throw "Pinned Steinberg VST3 SDK is missing"
          }

      - name: Verify Windows standalone resources
        shell: pwsh
        run: |
          $resource = "product/AeylaVisualDmx/resources/main.rc"
          if (-not (Test-Path $resource)) {
            throw "Windows APP resource file is missing; iPlug2 cannot create IDD_DIALOG_MAIN"
          }
          $text = Get-Content $resource -Raw
          foreach ($required in @("IDD_DIALOG_MAIN", "IDR_MENU1", "IDR_ACCELERATOR1")) {
            if ($text -notmatch $required) {
              throw "Windows APP resource is missing $required"
            }
          }

      - name: Configure graphical product
        shell: pwsh
        run: >-
          cmake -S product -B build-graphical
          -DIPLUG2_DIR="${{ github.workspace }}/external/iPlug2"
          -DIPLUG_DEPLOY_PLUGINS=OFF
          -DIGRAPHICS_BACKEND=NANOVG

      - name: Build Windows APP and VST3
        run: cmake --build build-graphical --config Release --target AeylaVisualDmx-app AeylaVisualDmx-vst3

      - name: Windows graphical startup smoke
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path build-graphical -Recurse -File -Filter "AeylaVisualDmx.exe" | Select-Object -First 1
          if (-not $app) { throw "Graphical standalone executable was not produced" }

          $evidenceDir = Join-Path (Resolve-Path build-graphical) "evidence"
          New-Item -ItemType Directory -Force $evidenceDir | Out-Null
          $evidence = Join-Path $evidenceDir "WINDOWS_GRAPHICAL_STARTUP.txt"

          # GitHub-hosted runners are headless/non-interactive for this purpose.
          # The previous gate passed an unsupported --screenshot argument and
          # required a native MainWindowHandle, creating persistent false reds.
          # CI now verifies the graphical executable starts and does not crash.
          # Real window creation/input remains a mandatory manual REAPER/Windows
          # release gate on an interactive workstation.
          $process = Start-Process -FilePath $app.FullName -ArgumentList "--no-io" -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            @(
              "RESULT: FAILED - graphical APP exited during startup smoke"
              "ExitCode: $($process.ExitCode)"
              "Commit: $env:GITHUB_SHA"
              "Executable: $($app.FullName)"
            ) | Set-Content -Encoding UTF8 $evidence
            Get-Content $evidence
            throw "Graphical APP exited with code $($process.ExitCode)"
          }

          @(
            "RESULT: PASS - graphical APP remained alive during headless startup smoke"
            "PID: $($process.Id)"
            "Commit: $env:GITHUB_SHA"
            "Executable: $($app.FullName)"
            "MANUAL_GATE_REQUIRED: visible window + mouse/input in REAPER/Windows"
          ) | Set-Content -Encoding UTF8 $evidence
          Get-Content $evidence
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - name: Collect Windows graphical package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/Standalone | Out-Null
          New-Item -ItemType Directory -Force package/VST3 | Out-Null
          New-Item -ItemType Directory -Force package/Evidence | Out-Null

          $app = Get-ChildItem -Path build-graphical -Recurse -File -Filter "AeylaVisualDmx.exe" | Select-Object -First 1
          if (-not $app) { throw "Graphical standalone executable was not produced" }
          Copy-Item -Force $app.FullName package/Standalone/

          $vst3 = Get-ChildItem -Path build-graphical -Recurse -Directory -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "Graphical VST3 bundle was not produced" }
          Copy-Item -Recurse -Force $vst3.FullName package/VST3/

          if (Test-Path build-graphical/evidence/WINDOWS_GRAPHICAL_STARTUP.txt) {
            Copy-Item -Force build-graphical/evidence/WINDOWS_GRAPHICAL_STARTUP.txt package/Evidence/
          }

          @'
          @echo off
          cd /d "%~dp0"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-ChildItem -Path '%~dp0' -Recurse -File | Unblock-File -ErrorAction SilentlyContinue"
          set "SOURCE=%~dp0VST3\AeylaVisualDmx.vst3"
          set "DEST=C:\Program Files\Common Files\VST3\AeylaVisualDmx.vst3"
          if not exist "%SOURCE%" (
            echo ERROR: No se encontro el bundle VST3.
            pause
            exit /b 1
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process powershell -Verb RunAs -Wait -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-Command','if (Test-Path ''%DEST%'') { Remove-Item -Recurse -Force ''%DEST%'' }; Copy-Item -Recurse -Force ''%SOURCE%'' ''%DEST%'''"
          echo Instalacion VST3 finalizada.
          pause
          '@ | Set-Content -Encoding ASCII package/INSTALAR_VST3_AEYLA.cmd

          @'
          AEYLA VISUAL DMX R07 — WINDOWS GRAPHICAL PRETEST

          CI valida:
          - recursos nativos Windows presentes;
          - compilacion APP + VST3;
          - arranque del ejecutable sin crash durante smoke headless.

          Gate manual obligatorio:
          - abrir AEYLA en REAPER/Windows real;
          - confirmar ventana visible, mouse y entrada;
          - validar Art-Net con receptor externo antes de uso de show.

          El runner de GitHub no se considera un escritorio interactivo y no
          certifica por si solo la creacion/uso real de una ventana.
          '@ | Set-Content -Encoding UTF8 package/LEEME_PRIMERO.txt

          @(
            "R07 PRETEST"
            "Commit: $env:GITHUB_SHA"
            "iPlug2: $env:IPLUG2_COMMIT"
            "VST3 SDK: $env:VST3SDK_COMMIT"
          ) | Set-Content -Encoding UTF8 package/VERSION.txt

          $appHash = (Get-FileHash package/Standalone/AeylaVisualDmx.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $vst3Binary = Get-ChildItem package/VST3/AeylaVisualDmx.vst3 -Recurse -File -Filter "AeylaVisualDmx.vst3" | Select-Object -First 1
          $vst3Hash = (Get-FileHash $vst3Binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$appHash  Standalone/AeylaVisualDmx.exe"
            "$vst3Hash  VST3/AeylaVisualDmx.vst3/Contents/x86_64-win/AeylaVisualDmx.vst3"
          ) | Set-Content -Encoding ASCII package/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AEYLA-R07-Windows-Graphical-APP-and-VST3
          path: package/**
          if-no-files-found: error

  macos-graphical:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned graphical framework and VST3 SDK
        run: |
          git clone https://github.com/iPlug2/iPlug2.git external/iPlug2
          git -C external/iPlug2 checkout "$IPLUG2_COMMIT"

          sdk_path="external/iPlug2/Dependencies/IPlug/VST3_SDK"
          rm -rf "$sdk_path"
          git clone --recursive https://github.com/steinbergmedia/vst3sdk.git "$sdk_path"
          git -C "$sdk_path" checkout "$VST3SDK_COMMIT"
          git -C "$sdk_path" submodule update --init --recursive
          test -d "$sdk_path/pluginterfaces"

      - name: Configure graphical universal product
        run: >-
          cmake -S product -B build-graphical -G Xcode
          -DIPLUG2_DIR="${GITHUB_WORKSPACE}/external/iPlug2"
          -DIPLUG2_UNIVERSAL=ON
          -DIPLUG_DEPLOY_PLUGINS=OFF
          -DIGRAPHICS_BACKEND=NANOVG
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build macOS APP and VST3
        shell: bash
        run: |
          set +e
          mkdir -p build-graphical/diagnostics
          cmake --build build-graphical --config Release --target AeylaVisualDmx-app AeylaVisualDmx-vst3 2>&1 | tee build-graphical/diagnostics/macos-build.log
          status=${PIPESTATUS[0]}
          echo "$status" > build-graphical/diagnostics/macos-build-exit-code.txt
          exit "$status"

      - name: Upload macOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AEYLA-macOS-graphical-build-diagnostics
          path: build-graphical/diagnostics/**
          if-no-files-found: warn

      - name: Collect macOS graphical package
        run: |
          mkdir -p package/Standalone package/VST3
          app="$(find build-graphical -type d -name 'AeylaVisualDmx.app' | head -n 1)"
          test -n "$app"
          cp -R "$app" package/Standalone/

          vst3="$(find build-graphical -type d -name 'AeylaVisualDmx.vst3' | head -n 1)"
          test -n "$vst3"
          cp -R "$vst3" package/VST3/

          file package/Standalone/AeylaVisualDmx.app/Contents/MacOS/*
          file package/VST3/AeylaVisualDmx.vst3/Contents/MacOS/*

          cat > package/LEEME_PRUEBA_GRAFICA.txt <<'README'
          AEYLA VISUAL DMX R07 — macOS GRAPHICAL PRETEST

          Open Standalone/AeylaVisualDmx.app or load the VST3 in the target host.
          This is an unsigned PRETEST build. Physical Art-Net show use still
          requires the explicit field-validation gate.
          README

          mkdir -p artifacts
          tar -czf artifacts/AEYLA-R07-macOS-Graphical-APP-and-VST3.tar.gz -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: AEYLA-R07-macOS-Graphical-APP-and-VST3
          path: artifacts/**
          if-no-files-found: error
