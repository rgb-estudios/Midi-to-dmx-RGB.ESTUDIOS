name: r107-apply-live-ui

on:
  push:
    branches:
      - rgb/r10.7-renamable-live-memories-ui-20260831
    paths:
      - tools/r107_apply_live_ui.py
      - .github/workflows/r107-apply-live-ui.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rgb/r10.7-renamable-live-memories-ui-20260831
          fetch-depth: 0
          persist-credentials: true

      - name: Apply R10.7 live UI
        run: |
          python3 tools/r107_apply_live_ui.py
          git diff --check

      - name: Configure core
        run: cmake -S . -B build

      - name: Build core
        run: cmake --build build --config Release

      - name: Test core
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Publish verified UI and remove one-shot tooling
        run: |
          git config user.name "rgb-estudios-r10.7-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product/AeylaVisualDmx/AeylaRuntimeStatusControl.h
          git rm tools/r107_apply_live_ui.py \
                 .github/workflows/r107-apply-live-ui.yml
          git diff --cached --check
          git commit -m "feat(r10.7): add paged renamable live-memory surface"
          git push origin HEAD:rgb/r10.7-renamable-live-memories-ui-20260831
